<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Teacher Flávio</title>
  <link rel="canonical" href="/login/">
  <script>
    (async function () {
      "use strict";

      const params = new URLSearchParams(window.location.search);
      const passwordAccessMode = params.get("password_access") === "1";
      const allowedUserId = "b6a3e909-e395-424a-a4eb-3a448f188e97";

      function safeNext() {
        const value = String(params.get("next") || "/area-do-estudante/").trim();
        if (!value.startsWith("/") || value.startsWith("//")) return "/area-do-estudante/";
        return value;
      }

      function sleep(ms) {
        return new Promise(function (resolve) { setTimeout(resolve, ms); });
      }

      async function waitForPasswordUi() {
        for (let attempt = 0; attempt < 50; attempt++) {
          if (
            window.Auth &&
            document.getElementById("googleLoginButton") &&
            document.getElementById("loginError") &&
            document.querySelector(".header h1")
          ) {
            return true;
          }
          await sleep(100);
        }
        return false;
      }

      async function setupPasswordAccess() {
        if (!passwordAccessMode) return;
        const ready = await waitForPasswordUi();
        if (!ready) return;

        const googleButton = document.getElementById("googleLoginButton");
        const loginError = document.getElementById("loginError");
        const notice = document.getElementById("loginNotice");
        const loginNote = document.querySelector(".login-note");
        const title = document.querySelector(".header h1");
        const subtitle = document.querySelector(".header p");

        document.title = "Acesso por senha - Teacher Flávio";
        title.textContent = "Entrar com e-mail e senha";
        subtitle.textContent = "Use o mesmo e-mail e a mesma senha que já estão cadastrados no site.";
        googleButton.hidden = true;
        if (loginNote) loginNote.hidden = true;
        if (notice) notice.hidden = true;
        loginError.textContent = "";

        const style = document.createElement("style");
        style.textContent = [
          "#passwordAccessForm{margin-top:18px}",
          "#passwordAccessForm label{display:block;margin:14px 0 7px;color:#cbd5e1;font-size:13px;font-weight:700}",
          "#passwordAccessForm input{width:100%;min-height:48px;padding:12px 14px;border:1px solid rgba(148,163,184,.28);border-radius:12px;background:rgba(15,23,42,.72);color:#f8fafc;font:inherit;outline:none}",
          "#passwordAccessForm input:focus{border-color:#818cf8;box-shadow:0 0 0 3px rgba(129,140,248,.14)}",
          ".password-field{position:relative}",
          ".password-field input{padding-right:82px!important}",
          "#toggleExistingPassword{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:auto;min-height:34px;margin:0;padding:7px 9px;background:transparent;border:0;color:#a5b4fc;font:700 12px Georgia,serif;cursor:pointer}",
          "#passwordAccessSubmit{margin-top:20px;background:linear-gradient(90deg,#818cf8,#a78bfa)}",
          ".existing-account-note{margin:14px 0 0;color:#64748b;font-size:12px;line-height:1.55;text-align:center}"
        ].join("");
        document.head.appendChild(style);

        const form = document.createElement("form");
        form.id = "passwordAccessForm";
        form.noValidate = true;
        form.innerHTML = [
          '<label for="existingEmail">E-mail</label>',
          '<input id="existingEmail" name="email" type="email" autocomplete="username" inputmode="email" required>',
          '<label for="existingPassword">Senha</label>',
          '<div class="password-field">',
          '<input id="existingPassword" name="password" type="password" autocomplete="current-password" required>',
          '<button id="toggleExistingPassword" type="button" aria-label="Mostrar senha">MOSTRAR</button>',
          '</div>',
          '<button id="passwordAccessSubmit" type="submit">ENTRAR</button>',
          '<p class="existing-account-note">Este acesso apenas autentica a conta existente. Nenhum novo cadastro ou nova matrícula é criado.</p>'
        ].join("");
        googleButton.insertAdjacentElement("afterend", form);

        const emailInput = document.getElementById("existingEmail");
        const passwordInput = document.getElementById("existingPassword");
        const submitButton = document.getElementById("passwordAccessSubmit");
        const toggleButton = document.getElementById("toggleExistingPassword");

        toggleButton.addEventListener("click", function () {
          const showing = passwordInput.type === "text";
          passwordInput.type = showing ? "password" : "text";
          toggleButton.textContent = showing ? "MOSTRAR" : "OCULTAR";
          toggleButton.setAttribute("aria-label", showing ? "Mostrar senha" : "Ocultar senha");
          passwordInput.focus();
        });

        form.addEventListener("submit", async function (event) {
          event.preventDefault();
          loginError.textContent = "";

          const email = emailInput.value.trim();
          const password = passwordInput.value;
          if (!email || !password) {
            loginError.textContent = "Informe seu e-mail e sua senha.";
            return;
          }
          if (!window.Auth || !Auth.isConfigured || !Auth.isConfigured()) {
            loginError.textContent = "Não foi possível carregar a autenticação. Atualize a página e tente novamente.";
            return;
          }

          emailInput.disabled = true;
          passwordInput.disabled = true;
          submitButton.disabled = true;
          submitButton.textContent = "ENTRANDO...";

          try {
            await Auth.signIn(email, password);
            const user = await Auth.getUser();
            const client = Auth.getClient();

            if (!user || user.id !== allowedUserId) {
              try { await client.auth.signOut({ scope: "local" }); } catch (_) {}
              throw new Error("unauthorized_existing_account");
            }

            const profileResult = await client
              .from("profiles")
              .select("id,enrolled,archived,profile_completed")
              .eq("id", user.id)
              .maybeSingle();

            const profile = profileResult.data;
            if (
              profileResult.error ||
              !profile ||
              profile.id !== allowedUserId ||
              profile.enrolled !== true ||
              profile.archived === true ||
              profile.profile_completed !== true
            ) {
              try { await client.auth.signOut({ scope: "local" }); } catch (_) {}
              throw new Error("invalid_existing_enrollment");
            }

            window.location.replace(safeNext());
          } catch (_) {
            loginError.textContent = "E-mail ou senha incorretos, ou esta conta não está autorizada para este acesso.";
            emailInput.disabled = false;
            passwordInput.disabled = false;
            submitButton.disabled = false;
            submitButton.textContent = "ENTRAR";
            passwordInput.value = "";
            passwordInput.focus();
          }
        });
      }

      try {
        const response = await fetch('/login.html', { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const html = await response.text();
        document.open();
        document.write(html.replace('<head>', '<head>\n  <base href="/">'));
        document.close();
        setupPasswordAccess();
      } catch (error) {
        console.error("Não foi possível carregar o login:", error);
        document.body.innerHTML = "<p style='font-family:sans-serif;padding:24px'>Não foi possível carregar a página de login.</p>";
      }
    })();
  </script>
</head>
<body>
  <p>Carregando login...</p>
  <script defer src="/site_footer.js?v=20260814-1"></script>
</body>
</html>
