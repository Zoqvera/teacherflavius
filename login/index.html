    (async function () {
      "use strict";

      try {
        const response = await fetch('/login.html', { cache: 'no-store' });

        let html = await response.text();
        html = html.replace('<head>', '<head>\n  <base href="/">');
        html = html.replace(
          '</style>',

        );
        html = html.replace('<body>

<!-- End Google Tag Manager (noscript) -->
', '<body class="login-page">');

        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        console.error("Não foi possível carregar o login:", error);
        document.body.className = "login-page";
        document.body.innerHTML = '<main class="box"><div class="header"><div><span class="badge">TEACHER FLÁVIO</span></div><h1>Não foi possível carregar o login</h1><p>Atualize a página e tente novamente.</p></div><div class="links"><a class="btn secondary" href="/">VOLTAR AO INÍCIO</a></div></main>';
