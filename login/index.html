<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Teacher Flávio</title>
  <link rel="canonical" href="/login/">
  <script>
    (async function () {
      "use strict";

      try {
        const response = await fetch('/login.html', { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);

        let html = await response.text();
        html = html.replace(
          '<head>',
          '<head>\n  <base href="/">\n  <link rel="stylesheet" href="/login/login_visual.css?v=20260901-1">'
        );
        html = html.replace('<body>', '<body class="login-page">');

        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        console.error("Não foi possível carregar o login:", error);
        document.body.className = "login-page";
        document.body.innerHTML = '<main class="box"><div class="header"><div><span class="badge">TEACHER FLÁVIO</span></div><h1>Não foi possível carregar o login</h1><p>Atualize a página e tente novamente.</p></div><div class="links"><a class="btn secondary" href="/">VOLTAR AO INÍCIO</a></div></main>';
      }
    })();
  </script>
  <link rel="stylesheet" href="/login/login_visual.css?v=20260901-1">
</head>
<body class="login-page">
  <p>Carregando login...</p>
</body>
</html>
