  <style>
    .page-description {
      color: #cbd5e1;
      font-size: 15px;
      line-height: 1.6;
      max-width: 820px;
      margin: 12px auto 0;
      text-align: center;
    }
    .lesson-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: transform 0.2s, border-color 0.2s, background 0.2s;
      backdrop-filter: blur(12px);
    }
    .lesson-card.done {
      border-color: rgba(110,231,183,0.45);
      background: rgba(110,231,183,0.07);
    }
    .lesson-card:hover {
      transform: translateY(-3px);
      border-color: rgba(129,140,248,0.5);
      background: rgba(129,140,248,0.07);
    }
    .lesson-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      color: #f1f5f9;
      font-size: 17px;
      font-weight: bold;
      letter-spacing: 0.5px;
      text-decoration: none;
    }
    .lesson-title span:first-child {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    a.lesson-title { cursor: pointer; }
    a.lesson-title:hover .arrow {
      color: #818cf8;
      transform: translateX(4px);
    }
    .lesson-description {
      color: #cbd5e1;
      font-size: 14px;
      line-height: 1.55;
      margin-top: -4px;
    }
    .completion-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .completion-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid rgba(129,140,248,0.45);
      background: rgba(129,140,248,0.10);
      color: #c4b5fd;
      border-radius: 12px;
      padding: 10px 14px;
      font-family: Georgia, serif;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 0.4px;
      min-width: 150px;
    }
    .lesson-card.done .completion-button {
      border-color: rgba(110,231,183,0.45);
      background: rgba(110,231,183,0.10);
      color: #6ee7b7;
    }
    .completion-button:disabled { opacity: 0.65; cursor: not-allowed; }
    .completion-status { color: #94a3b8; font-size: 12px; text-align: right; min-width: 90px; }
    .completion-status.saved { color: #6ee7b7; }
    .completion-status.error { color: #fca5a5; }
  </style>

    <div class="header">
      <div><span class="badge">TEACHER FLÁVIO</span></div>
      <h1>Roteiro de Estudos</h1>
      <p class="page-description">ESSAS LIÇÕES DEVEM SER APRESENTADAS DURANTE A AULA. VOCÊ SE PREPARA EM CASA E VAI PARA A AULA E APRESENTA.</p>
      <div id="loginStatus" class="status">Verificando acesso...</div>

  <script>
    let currentUser = null;
    let completedLessons = new Map();

    const lessonLinks = {
      "lesson-1": "https://drive.google.com/file/d/1IcPBeVjsZfm0RnqqUwhDhwoF2QY3qIA1/view?usp=sharing",
      "lesson-2": "https://drive.google.com/file/d/1LDXrDtGGiMKNUe_DWFSLu-k3IKQmQcYB/view?usp=sharing",
      "lesson-3": "https://drive.google.com/file/d/1-Sav9gssbAMYVUqVv0-MdwvUxT-H3eGX/view?usp=sharing",
      "lesson-4": "https://drive.google.com/file/d/1Rjq4Oqpx_JRsAECFGLtteRrSINIDmFER/view?usp=sharing",
      "lesson-5": "https://drive.google.com/file/d/1Ke_jLAODBKpd0OLaFF8sklof6JcperdY/view?usp=sharing",
      "lesson-6": "https://drive.google.com/file/d/1TP5NADYwClQGFo77ev443famp63-O4ry/view?usp=sharing",
      "lesson-7": "https://drive.google.com/file/d/1NeR_jXZWRv7qboHEG1LslyWTSzRGs1tm/view?usp=sharing",
      "lesson-8": "https://drive.google.com/file/d/1m_63uJwB_ag9wFt1TB9uCr2MjjLUqUum/view?usp=sharing",
      "lesson-9": "https://drive.google.com/file/d/18uEqMcwSVZKE8l6p_RtWMiMGdZutoOgW/view?usp=sharing",
      "lesson-10": "https://drive.google.com/file/d/1XeKm2x-kuv69q7LsVDjek-AYLTicHbIe/view?usp=sharing",
      "lesson-11": "https://drive.google.com/file/d/1IQmyLLn48kYy5jwtXHPcTo2ND7BtoUiX/view?usp=sharing",
      "lesson-12": "https://drive.google.com/file/d/1Y8GfT5usJloYaqjJ3QDbDjGr7qtjv5Ja/view?usp=sharing",
      "lesson-13": "https://drive.google.com/file/d/1yv3OFxTGA0mBDQUSLr0XimUuiXWO9rYq/view?usp=sharing",
      "lesson-14": "https://drive.google.com/file/d/1616T4D-rOJUFVjQksrgicKxSowjJ1w1B/view?usp=drivesdk",
      "lesson-15": "https://drive.google.com/file/d/18rFFtbEAMbjDfOEyKv0G0BMusJE8BjAe/view?usp=drive_link",
      "lesson-16": "https://drive.google.com/file/d/1HmYII_gk0BAiscuNwsGZON7QSX5dtLzZ/view?usp=sharing",
      "lesson-17": "https://drive.google.com/file/d/1tACff-0CckERLisJ9A3vGWekDQ3Jlq9D/view?usp=sharing",
      "lesson-18": "https://drive.google.com/file/d/1aaeAIOGJwSfLZYWp0yeFUv7uUaM2cYcx/view?usp=drive_link",
      "lesson-19": "https://drive.google.com/file/d/1tNKSboLBxpQczN3kgil2eMHiMi1kG9VC/view?usp=sharing",
      "lesson-20": "https://drive.google.com/file/d/1CFnlK6IpYY5IDWMcRn_buS4EuXWcdyF5/view?usp=drive_link"
    };

    const lessonDescriptions = {
      "lesson-1": "Nesta aula, você vai aprender a se apresentar em inglês de forma simples, clara e natural, falando sobre informações pessoais básicas.",
      "lesson-2": "Nesta aula, você vai aprender a fazer perguntas simples e educadas para conhecer outra pessoa em inglês, falando sobre aspectos gerais da vida dela sem ser invasivo, inconveniente ou excessivamente pessoal.",
      "lesson-3": "Nesta aula, você vai aprender a falar sobre sua rotina em inglês, descrevendo atividades habituais de maneira simples, clara e organizada.",
      "lesson-4": "Nesta aula, você vai aprender a expressar seus gostos e preferências em inglês de forma simples, clara e natural, falando sobre aquilo de que gosta, não gosta e prefere em diferentes situações do dia a dia.",
      "lesson-5": "Nesta aula, você vai aprender a falar sobre sua família e sobre pessoas próximas em inglês, descrevendo quem essas pessoas são, qual é sua relação com elas e algumas características básicas de cada uma.",
      "lesson-6": "Nesta aula, você vai aprender a descrever a sua aparência física e a sua personalidade em inglês, utilizando vocabulário básico e estruturas simples para falar de forma clara e natural.",
      "lesson-7": "Nesta aula, você vai aprender a falar sobre sua casa em inglês, descrevendo o tipo de moradia em que vive, os cômodos da casa e algumas características básicas de cada ambiente.",
      "lesson-8": "Nesta aula, você vai aprender a falar sobre comidas e bebidas em inglês, nomeando itens comuns da alimentação do dia a dia e descrevendo aquilo de que gosta, não gosta e prefere comer ou beber.",
      "lesson-9": "Nesta aula, você vai aprender a falar sobre a sua cidade e lugares que você frequenta.",
      "lesson-10": "Nesta aula, você vai aprender a falar sobre coisas que você gosta de comprar e preços.",
      "lesson-11": "Nesta aula, você vai aprender a falar sobre coisas que você gosta de fazer no seu tempo livre.",
      "lesson-12": "Nesta aula, você vai aprender a falar sobre datas, horários e compromissos.",
      "lesson-13": "Nesta aula, você vai aprender a falar sobre coisas que já aconteceram contigo.",
      "lesson-14": "Nesta aula, você vai aprender a falar sobre coisas que você consegue fazer e habilidades que você tem.",
      "lesson-15": "Nesta aula, você vai aprender a falar sobre coisas que você fez em algum momento do passado.",
      "lesson-16": "Nesta aula, você vai aprender a falar sobre seus planos para o futuro.",
      "lesson-17": "Nesta aula, você vai aprender a falar sobre clima e estações do ano.",
      "lesson-18": "Nesta aula, você vai aprender a falar sobre vestimentas e as ocasiões em que você veste alguns tipos de roupa.",
      "lesson-19": "Nesta aula, você vai aprender a falar sobre saúde e bem-estar.",
      "lesson-20": "Nesta aula, você vai aprender a falar sobre direções e localização."
    };

    function redirectToLogin() {
      window.location.href = "login.html?next=" + encodeURIComponent("roteiro_de_estudos.html");
    }

    function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

    async function waitForAuthResources() {
      for (let i = 0; i < 10; i++) {
        if (window.Auth && window.SUPABASE_CONFIG && Auth.isConfigured()) return true;
        await sleep(150);
      }
      return !!(window.Auth && window.SUPABASE_CONFIG && Auth.isConfigured());
    }

    function setStatus(text) {
      document.getElementById("loginStatus").textContent = text;
    }

    function renderLessonTitle(lessonId, title) {
      const lessonUrl = lessonLinks[lessonId];
      const inner = '<span><span class="icon">📖</span>' + title + '</span><span class="arrow">›</span>';
      if (!lessonUrl) return '<div class="lesson-title">' + inner + '</div>';
      return '<a class="lesson-title" href="' + lessonUrl + '" target="_blank" rel="noopener noreferrer">' + inner + '</a>';
    }

    function renderLessonDescription(lessonId) {
      const description = lessonDescriptions[lessonId];
      if (!description) return "";
      return '<p class="lesson-description">' + description + '</p>';
    }

    function renderLessons() {
      const grid = document.getElementById("lessonsGrid");
      const cards = [];
      for (let i = 1; i <= 24; i++) {
        const lessonId = "lesson-" + i;
        const title = "Lição " + i;
        const isDone = completedLessons.get(lessonId) === true;
        cards.push(
          '<div class="lesson-card ' + (isDone ? 'done' : '') + '" data-lesson-id="' + lessonId + '">' +
            renderLessonTitle(lessonId, title) +
            renderLessonDescription(lessonId) +
            '<div class="completion-row">' +
              '<button type="button" class="completion-button" data-lesson-id="' + lessonId + '">' + (isDone ? 'MARCAR COMO NÃO FEITA' : 'MARCAR COMO FEITA') + '</button>' +
              '<span class="completion-status ' + (isDone ? 'saved' : '') + '" id="status-' + lessonId + '">' + (isDone ? 'Feita' : 'Não feita') + '</span>' +
            '</div>' +
          '</div>'
        );
      }
      grid.innerHTML = cards.join("");

      document.querySelectorAll(".completion-button").forEach(function (button) {
        button.addEventListener("click", function () {
          const lessonId = button.dataset.lessonId;
          const nextValue = !(completedLessons.get(lessonId) === true);
          saveLessonCompletion(lessonId, nextValue, button);
        });
      });
    }

    async function loadCompletedLessons() {
      const client = Auth.getClient();
      const response = await client
        .from("study_roadmap_completion")
        .select("lesson_id, completed")
        .eq("user_id", currentUser.id);

      if (response.error) throw response.error;
      completedLessons = new Map((response.data || []).map(function (row) {
        return [row.lesson_id, row.completed === true];
      }));
    }

    async function saveLessonCompletion(lessonId, completed, button) {
      const lessonNumber = Number(lessonId.replace("lesson-", ""));
      const lessonTitle = "Lição " + lessonNumber;
      const card = document.querySelector('[data-lesson-id="' + lessonId + '"]');
      const status = document.getElementById("status-" + lessonId);
      const client = Auth.getClient();

      button.disabled = true;
      button.textContent = "SALVANDO...";
      status.className = "completion-status";
      status.textContent = "Salvando...";

      try {
        const response = await client
          .from("study_roadmap_completion")
          .upsert({
            user_id: currentUser.id,
            lesson_id: lessonId,
            lesson_number: lessonNumber,
            lesson_title: lessonTitle,
            completed: completed,
            completed_at: completed ? new Date().toISOString() : null,
            updated_at: new Date().toISOString()
          }, { onConflict: "user_id,lesson_id" });

        if (response.error) throw response.error;

        completedLessons.set(lessonId, completed);
        if (card) card.classList.toggle("done", completed);
        button.textContent = completed ? "MARCAR COMO NÃO FEITA" : "MARCAR COMO FEITA";
        status.className = "completion-status saved";
        status.textContent = completed ? "Feita" : "Não feita";
      } catch (error) {
        status.className = "completion-status error";
        status.textContent = "Erro ao salvar";
        button.textContent = completed ? "MARCAR COMO FEITA" : "MARCAR COMO NÃO FEITA";
      } finally {
        button.disabled = false;
      }
    }

    async function guardPage() {
      const resourcesReady = await waitForAuthResources();

      if (!resourcesReady) {
        setStatus("Não foi possível carregar a autenticação. Atualize a página ou limpe o cache do navegador.");
        document.body.classList.remove("auth-checking");
        renderLessons();
        return;
      }

      const session = await Auth.getSession();
      if (!session || !session.user) {
        redirectToLogin();
        return;
      }

      currentUser = session.user;

      try {
        await loadCompletedLessons();
        setStatus("Aluno conectado: " + currentUser.email + ".");
      } catch (error) {
        setStatus("Não foi possível carregar seus registros. Execute supabase_roteiro_de_estudos.sql no Supabase.");
      }

      document.body.classList.remove("auth-checking");
      renderLessons();
    }

    guardPage();
  </script>
