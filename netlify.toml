[build]
  command = "python3 scripts/build_static_site.py && python3 scripts/inject_site_asset_loader.py && python3 scripts/inject_site_privacy_analytics.py && python3 scripts/inject_auth_module_loader.py && python3 scripts/inject_google_tag_manager.py && python3 scripts/postprocess_production.py"
  publish = "_site"

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

# Mantém o hostname padrão do Netlify fora do índice e preserva o domínio canônico.
# Branch deploys (por exemplo, main--teacherflavius.netlify.app) não são afetados.
[[redirects]]
  from = "https://teacherflavius.netlify.app/*"
  to = "https://teacherflavius.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://teacherflavius.netlify.app/*"
  to = "https://teacherflavius.com/:splat"
  status = 301
  force = true
