<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Mensalidades - Teacher Flávio</title>
  <link rel="canonical" href="/mensalidades/">
  <script>
    (async function () {
      const response = await fetch('/mensalidades.html', { cache: 'no-store' });
      const html = await response.text();
      const enhancedHtml = html
        .replace('<head>', '<head>\n  <base href="/">\n  <link rel="canonical" href="/mensalidades/">')
        .replace('href="/professor.html"', 'href="/professor/"')
        .replace('</head>', '  <link rel="stylesheet" href="/mensalidades/mensalidades_visual.css?v=20260901-1">\n</head>')
        .replace('</body>', '<script src="/mensalidades/mensalidades_visual.js?v=20260901-1"><\/script>\n</body>');
      document.open();
      document.write(enhancedHtml);
      document.close();
    })();
  </script>
</head>
<body>
  <p>Carregando controle de mensalidades...</p>
</body>
</html>
