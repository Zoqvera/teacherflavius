  <title>Relatórios - Teacher Flávio</title>
  <script>
    (function () {
      "use strict";

      var current = new URL(window.location.href);

      target.hash = current.hash;
      window.location.replace(target.pathname + target.search + target.hash);
    })();
  </script>
