<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#02102B">
  <title>Instalar Teacher Flávio</title>
  <meta name="description" content="Instale o aplicativo Teacher Flávio no seu celular.">
  <link rel="canonical" href="https://teacherflavius.com/instalar-app/">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="/responsive_compat.css?v=20260902-1">
  <link rel="stylesheet" href="/instalar-app/style.css?v=20261005-1">
  <script src="/pwa_registration.js?v=20261004-2"></script>
</head>
<body>
  <main class="install-shell">
    <section class="install-card" aria-labelledby="installTitle">
      <div class="install-brand" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <rect x="5" y="2" width="14" height="20" rx="3"></rect>
          <path d="M9 18h6"></path>
          <path d="M12 6v7"></path>
          <path d="m9 10 3 3 3-3"></path>
        </svg>
      </div>

      <p class="install-eyebrow">TEACHER FLÁVIO</p>
      <h1 id="installTitle">Instale o aplicativo</h1>
      <p class="install-copy">
        Tenha acesso rápido à Área do Estudante diretamente pela tela inicial do seu celular.
      </p>

      <button id="installAppButton" class="install-button" type="button" disabled>
        <span>INSTALAR APP</span>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3v12"></path>
          <path d="m7 10 5 5 5-5"></path>
          <path d="M5 21h14"></path>
        </svg>
      </button>

      <p id="installStatus" class="install-status" role="status" aria-live="polite">
        Preparando a instalação...
      </p>

      <section id="manualInstructions" class="install-instructions" hidden aria-labelledby="manualTitle">
        <h2 id="manualTitle">Instalação pelo navegador</h2>
        <p id="manualInstructionsText"></p>
      </section>

      <a class="student-area-link" href="/area-do-estudante/">IR PARA A ÁREA DO ESTUDANTE</a>
    </section>
  </main>

  <script src="/instalar-app/app.js?v=20261005-1"></script>
  <script src="/error_monitor.js?v=20260902-1"></script>
</body>
</html>
