    <div class="report-tabs" role="tablist" aria-label="Tipos de relatório">
      <button class="report-tab active" type="button" data-target="syncFrame" role="tab" aria-selected="true">

      </button>

        <strong>🪑 Turmas com vagas disponíveis</strong>
        <span>Turmas QUARTETO com vagas, considerando a exceção de 5 alunos na quinta-feira às 21h.</span>

  <script>
    const tabs = Array.from(document.querySelectorAll('.report-tab'));
    const frames = Array.from(document.querySelectorAll('.report-frame'));

    function resizeEmbeddedFrame(frame) {
      try {
        const doc = frame.contentDocument;
        if (!doc || !doc.documentElement || frame.hidden) return;
        const bodyHeight = doc.body ? doc.body.scrollHeight : 0;
        const documentHeight = doc.documentElement.scrollHeight || 0;
        const minimum = window.innerWidth <= 720 ? 1250 : 1000;
        frame.style.height = Math.max(minimum, bodyHeight, documentHeight) + 'px';
      } catch (error) {
        // Mantém a altura mínima quando o navegador não permite medir o conteúdo.
      }
    }

    function activateTab(targetId) {
      tabs.forEach(function (tab) {
        const active = tab.dataset.target === targetId;
        tab.classList.toggle('active', active);
        tab.setAttribute('aria-selected', active ? 'true' : 'false');
      });
      frames.forEach(function (frame) {
        frame.hidden = frame.id !== targetId;
        if (!frame.hidden) {
          window.setTimeout(function () { resizeEmbeddedFrame(frame); }, 30);
        }
      });
    }

    tabs.forEach(function (tab) {
      tab.addEventListener('click', function () { activateTab(tab.dataset.target); });
    });

    function cleanEmbeddedPage(frame) {
      try {
        const doc = frame.contentDocument;
        if (!doc || !doc.head || !doc.documentElement) return;

        doc.documentElement.style.colorScheme = 'dark';

        let style = doc.getElementById('teacher-flavius-report-embed-cleanup');
        if (!style) {
          style = doc.createElement('style');
          style.id = 'teacher-flavius-report-embed-cleanup';
          style.textContent = `
            html {
              min-height: 100% !important;
              background: #071a45 !important;
              color-scheme: dark !important;
            }
            body {
              min-height: 100% !important;
              display: block !important;
              align-items: initial !important;
              justify-content: initial !important;
              margin: 0 !important;
              padding: 12px 0 28px !important;
              background: linear-gradient(160deg, #06183b 0%, #071a45 56%, #0a2956 100%) !important;
              background-attachment: scroll !important;
              color: #f1f5f9 !important;
            }
            .top-links, .header, .divider,
            #tf-mobile-top-navigation, #tf-mobile-top-menu-overlay,
            #teacher-flavius-whatsapp-float, .whatsapp-float,
            .tf-site-footer { display: none !important; }
            body.tf-mobile-menu-open { overflow: auto !important; }
            .container {
              max-width: none !important;
              width: 100% !important;
              margin: 0 !important;
              padding: 0 18px 24px !important;
              background: transparent !important;
            }
            .reports-content, #dashboardContent, #content { color: #f1f5f9 !important; }
            .day-card, .panel, .summary-card, .vacancy-card, .metric, .empty-panel, .empty,
            .table-wrap, .privacy-note {
              background-color: rgba(3,26,63,.78) !important;
              border-color: rgba(78,154,236,.24) !important;
              color: #e2e8f0 !important;
              box-shadow: none !important;
            }
            .reports-note, .reports-note small, .day-meta, .muted, .intro,
            .class-meta, .metric-label, .summary-card span, td {
              color: #cbd5e1 !important;
            }
            .day-title, .section-title, .student-name, .class-name,
            .metric-value, .summary-card strong, .panel h2 {
              color: #f8fafc !important;
            }
            table { background: rgba(2,16,43,.28) !important; }
            th {
              background: rgba(9,104,188,.18) !important;
              color: #dbeafe !important;
            }
            th, td { border-bottom-color: rgba(148,163,184,.14) !important; }
            select {
              background: #0b234b !important;
              color: #f8fafc !important;
              border-color: rgba(78,154,236,.38) !important;
            }
            .refresh-button, button.top-link {
              background: rgba(9,104,188,.22) !important;
              color: #f8fafc !important;
              border: 1px solid rgba(78,154,236,.48) !important;
            }
            @media (max-width: 720px) {
              .container { padding-left: 14px !important; padding-right: 14px !important; }
              .day-card, .panel, .vacancy-card { border-radius: 16px !important; }
              .reports-note { font-size: 14px !important; line-height: 1.6 !important; }
            }
          `;
          doc.head.appendChild(style);
        }

        if (frame._tfReportResizeObserver) {
          frame._tfReportResizeObserver.disconnect();
          frame._tfReportResizeObserver = null;
        }

        if (window.ResizeObserver && doc.body) {
          const observer = new ResizeObserver(function () { resizeEmbeddedFrame(frame); });
          observer.observe(doc.documentElement);
          observer.observe(doc.body);
          frame._tfReportResizeObserver = observer;
        }

        resizeEmbeddedFrame(frame);
        window.setTimeout(function () { resizeEmbeddedFrame(frame); }, 250);
        window.setTimeout(function () { resizeEmbeddedFrame(frame); }, 900);
      } catch (error) {
        console.warn('Não foi possível ajustar o relatório incorporado.', error);
      }
    }

    function loadEmbeddedFrame(frame) {
      const target = frame.dataset.embedSrc;
      if (!target || !frame.contentWindow) return;
      try {
        frame.contentWindow.location.replace(target);
      } catch (error) {
        frame.src = target;
      }
    }

    frames.forEach(function (frame) {
      frame.addEventListener('load', function () { cleanEmbeddedPage(frame); });
      loadEmbeddedFrame(frame);
    });

    window.addEventListener('resize', function () {
      frames.forEach(resizeEmbeddedFrame);
    });
  </script>
