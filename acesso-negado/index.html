<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Acesso não autorizado - Teacher Flávio</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      color: #f1f5f9;
      font-family: Georgia, serif;
    }
    main {
      width: min(100%, 480px);
      padding: 30px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 20px;
      background: rgba(255,255,255,.04);
      backdrop-filter: blur(12px);
      text-align: center;
    }
    .badge {
      display: inline-block;
      margin-bottom: 14px;
      padding: 4px 14px;
      border-radius: 20px;
      background: linear-gradient(90deg,#818cf8,#a78bfa);
      color: #fff;
      font: 700 11px monospace;
      letter-spacing: 3px;
    }
    h1 { margin: 0 0 10px; font-size: 32px; }
    p { margin: 0; color: #94a3b8; font-size: 15px; line-height: 1.65; }
    .actions { margin-top: 24px; display: grid; gap: 10px; }
    a {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 16px;
      border-radius: 12px;
      font-weight: 700;
      text-decoration: none;
    }
    .primary { background: linear-gradient(90deg,#818cf8,#a78bfa); color: #fff; }
    .secondary { border: 1.5px solid rgba(129,140,248,.35); background: rgba(255,255,255,.05); color: #cbd5e1; }
  </style>
</head>
<body>
  <main>
    <span class="badge">TEACHER FLÁVIO</span>
    <h1>Acesso não autorizado</h1>
    <p>Este recurso está disponível apenas para alunos com matrícula ativa e para o professor. Se sua matrícula acabou de ser ativada, entre novamente.</p>
    <div class="actions">
      <a class="primary" href="/login/">ENTRAR NOVAMENTE</a>
      <a class="secondary" href="/">VOLTAR AO INÍCIO</a>
    </div>
  </main>
</body>
</html>
