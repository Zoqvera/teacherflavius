    <div class="header"><div><span class="badge">TEACHER FLÁVIO</span></div><h1>Turmas</h1><div id="adminStatus" class="status">Verificando credenciais de professor...</div></div>
    <div class="divider"></div>
    <div class="form-panel">
      <h2>Criar nova turma</h2>
      <form id="createClassForm" class="form-grid">
        <label class="full" for="className">Nome da turma<input id="className" type="text" placeholder="Ex.: Turma A1 - Terça" /></label>
        <label for="classType">Tipo da turma<select id="classType" required><option value="">Selecione</option><option value="individual">INDIVIDUAL</option><option value="quartet">QUARTETO</option><option value="eight_students">8 ALUNOS</option></select></label>
        <label for="classWeekday">Dia semanal<select id="classWeekday"><option value="">Não definir agora</option><option value="1">Segunda-feira</option><option value="2">Terça-feira</option><option value="3">Quarta-feira</option><option value="4">Quinta-feira</option><option value="5">Sexta-feira</option><option value="6">Sábado</option><option value="7">Domingo</option></select></label>
        <label for="classStartTime">Horário<input id="classStartTime" type="time" /></label>
        <div class="schedule-help">Dia e horário são usados pelo painel MINHA SEMANA para informar a próxima aula do aluno.</div>
        <button class="delete-button full" type="submit" style="border-color:rgba(129,140,248,.45);background:rgba(129,140,248,.10);color:#c4b5fd;">CRIAR TURMA</button>
        <div id="classMessage" class="empty full" style="margin-top:4px;"></div>
      </form>
