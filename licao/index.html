<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Lição - Teacher Flávio</title>
  <script>
    (async function () {
      const response = await fetch('/licao.html', { cache: 'no-store' });
      const html = await response.text();
      document.open();
      document.write(html.replace('<head>', '<head>\n  <base href="/">'));
      document.close();
    })();
  </script>
</head>
<body>
  <p>Carregando lição...</p>
</body>
</html>
