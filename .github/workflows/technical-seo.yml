name: Technical SEO audit

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-technical-seo:
    name: Validate technical SEO
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run technical SEO audit
        run: python3 scripts/validate_seo.py
