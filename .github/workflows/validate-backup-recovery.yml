name: Backup recovery contract

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/supabase-encrypted-backup.yml
      - .github/workflows/supabase-backup-recovery-test.yml
      - .github/workflows/validate-backup-recovery.yml
      - scripts/create_encrypted_supabase_backup.sh
      - scripts/verify_supabase_backup_restore.sh
      - supabase/recovery/**
      - supabase/baseline/30_platform_config.sql
      - tests/test_backup_recovery_contract.py
  push:
    branches:
      - main
    paths:
      - .github/workflows/supabase-encrypted-backup.yml
      - .github/workflows/supabase-backup-recovery-test.yml
      - .github/workflows/validate-backup-recovery.yml
      - scripts/create_encrypted_supabase_backup.sh
      - scripts/verify_supabase_backup_restore.sh
      - supabase/recovery/**
      - supabase/baseline/30_platform_config.sql
      - tests/test_backup_recovery_contract.py

permissions:
  contents: read

jobs:
  contract:
    name: Validate backup and recovery contract
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v7

      - name: Validate shell syntax
        run: |
          bash -n scripts/create_encrypted_supabase_backup.sh
          bash -n scripts/verify_supabase_backup_restore.sh

      - name: Run recovery contract tests
        run: python3 -m unittest tests.test_backup_recovery_contract
