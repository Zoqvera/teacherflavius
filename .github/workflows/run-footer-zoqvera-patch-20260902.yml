name: Run footer Zoqvera patch 20260902

on:
  push:
    paths:
      - ".github/workflows/run-footer-zoqvera-patch-20260902.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/patch_footer_zoqvera_20260902.py
      - name: Commit footer change
        run: |
          set -euo pipefail
          if git diff --quiet -- site_footer_core.js; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "Zoqvera Development Automation"
          git config user.email "actions@users.noreply.github.com"
          git add site_footer_core.js
          git commit -m "feat: credit Zoqvera in site footer"
          git push origin HEAD:main
