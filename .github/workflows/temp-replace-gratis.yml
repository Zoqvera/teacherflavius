name: Temporary replace gratis

on:
  push:
    branches:
      - chore/substituir-gratis-por-gratuita

permissions:
  contents: write

jobs:
  replace-copy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: chore/substituir-gratis-por-gratuita

      - name: Replace public copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = (
              Path('index.html'),
              Path('curso-de-ingles-online/index.html'),
              Path('cro.js'),
          )

          for path in paths:
              original = path.read_text(encoding='utf-8')
              updated = original.replace('grátis', 'gratuita').replace('GRÁTIS', 'GRATUITA')
              path.write_text(updated, encoding='utf-8')
          PY

          if grep -Rni --include='index.html' --include='cro.js' 'grátis' index.html curso-de-ingles-online cro.js; then
            echo 'Ainda existem ocorrências de grátis nos arquivos-alvo.' >&2
            exit 1
          fi

      - name: Commit replacements
        shell: bash
        run: |
          if git diff --quiet -- index.html curso-de-ingles-online/index.html cro.js; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html curso-de-ingles-online/index.html cro.js
          git commit -m 'fix: substituir gratis por gratuita nas paginas publicas'
          git push origin HEAD:${GITHUB_REF_NAME}
