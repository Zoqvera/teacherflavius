name: Canonical Supabase bootstrap replay

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/baseline/**"
      - "scripts/compile_canonical_supabase_bootstrap.py"
      - "tests/test_canonical_supabase_bootstrap.py"
      - ".github/workflows/validate-supabase-baseline.yml"
      - ".github/workflows/canonical-supabase-bootstrap.yml"

permissions:
  contents: read

jobs:
  canonical-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out candidate
        uses: actions/checkout@v7

      - name: Validate canonical bootstrap generator contracts
        run: python3 -m unittest discover -s tests -p test_canonical_supabase_bootstrap.py

      - name: Compile immutable, disposable-only consolidated SQL
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/compile_canonical_supabase_bootstrap.py \
            --output "${RUNNER_TEMP}/canonical-bootstrap.sql" \
            --manifest "${RUNNER_TEMP}/canonical-manifest.json" \
            --fingerprint-sql "${RUNNER_TEMP}/canonical-fingerprint.sql"

          jq -e '.mode == "disposable-only" and .overlay_count == 84' \
            "${RUNNER_TEMP}/canonical-manifest.json"

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start isolated Supabase local stack without historical migrations
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d supabase/migrations ]]; then
            mv supabase/migrations "${RUNNER_TEMP}/original-migrations"
          fi
          if [[ -f supabase/seed.sql ]]; then
            mv supabase/seed.sql "${RUNNER_TEMP}/original-seed.sql"
          fi

          supabase init --force
          mkdir -p supabase/migrations
          supabase start

      - name: Apply compiled single-file canonical SQL
        shell: bash
        run: |
          set -euo pipefail
          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$DB_CONTAINER"

          docker exec -i "$DB_CONTAINER" \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < "${RUNNER_TEMP}/canonical-bootstrap.sql" \
            > "${RUNNER_TEMP}/canonical-psql-output.log"

          # Synthetic secret names only; never inject real production values.
          docker exec -i "$DB_CONTAINER" \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          select vault.create_secret(
            'disposable-replay-only-not-a-real-token',
            'teacherflavius_notification_webhook_secret',
            'Synthetic placeholder for schema comparison'
          );
          select vault.create_secret(
            'disposable-replay-only-not-a-real-key',
            'teacherflavius_web_push_vapid_private_key',
            'Synthetic placeholder for schema comparison'
          );
          SQL

      - name: Compare compiled bootstrap with production structure fingerprint
        shell: bash
        run: |
          set -euo pipefail
          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$DB_CONTAINER"

          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres \
            -At -v ON_ERROR_STOP=1 \
            < "${RUNNER_TEMP}/canonical-fingerprint.sql" \
            > "${RUNNER_TEMP}/canonical-actual.json"

          jq -S 'del(.captured_from_migration_version)' \
            supabase/baseline/schema-fingerprint.json \
            > "${RUNNER_TEMP}/canonical-expected-normalized.json"
          jq -S . "${RUNNER_TEMP}/canonical-actual.json" \
            > "${RUNNER_TEMP}/canonical-actual-normalized.json"
          diff -u "${RUNNER_TEMP}/canonical-expected-normalized.json" \
            "${RUNNER_TEMP}/canonical-actual-normalized.json"

          docker exec -i "$DB_CONTAINER" \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          do $assertions$
          begin
            if exists (select 1 from public.profiles)
              or exists (select 1 from public.monthly_tuition)
              or exists (select 1 from public.class_students)
            then
              raise exception 'Disposable bootstrap unexpectedly created student or financial records';
            end if;

            if (select count(*) from cron.job
                where jobname = 'web-push-notifications') <> 1 then
              raise exception 'Expected reviewed Cron job is missing';
            end if;

            if (select count(*) from pg_policies
                where schemaname = 'public') <> 91 then
              raise exception 'The RLS policy count has drifted';
            end if;

            if exists (
              select 1 from pg_class c
              join pg_namespace n on n.oid = c.relnamespace
              where n.nspname='public' and c.relkind in ('r','p')
                and (has_table_privilege('anon',c.oid,'TRUNCATE')
                  or has_table_privilege('authenticated',c.oid,'TRUNCATE'))
            ) then
              raise exception 'Unsafe browser privileges in compiled bootstrap';
            end if;
          end;
          $assertions$;
          SQL

      - name: Stop disposable Supabase stack
        if: always()
        run: supabase stop --no-backup
