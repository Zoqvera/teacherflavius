name: Lesson presentations stage 1 contracts

on:
  pull_request:
    paths:
      - "supabase/migrations/*lesson_presentations_stage1.sql"
      - "tests/test_lesson_presentations_stage1_contract.py"
      - "tests/fixtures/lesson_presentations_integrated_rls.sql"
      - ".github/workflows/lesson-presentations-stage1-contract.yml"

permissions:
  contents: read

jobs:
  lesson-presentations-schema-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run lesson presentation schema contracts
        run: python3 -m unittest discover -s tests -p "test_lesson_presentations_stage1_contract.py" -v

  lesson-presentations-integrated-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Build isolated canonical schema without production credentials
        shell: bash
        run: |
          set -euo pipefail
          TEST_DIR="${RUNNER_TEMP}/lesson-presentations-stage1b"
          mkdir -p "${TEST_DIR}"
          (cd "${TEST_DIR}" && supabase init --force)
          python3 -m scripts.prepare_supabase_cli_replay \
            --repo-root "${GITHUB_WORKSPACE}" \
            --staging-root "${TEST_DIR}"
          python3 -m scripts.audit_supabase_isolated_chain \
            --repository-root "${GITHUB_WORKSPACE}" \
            --staging-root "${TEST_DIR}" \
            --report-json "${TEST_DIR}/artifacts/chain-audit.json"
          jq -e '.status == "LOCAL_CHAIN_VALIDATED" and .automatic_branching_safe == false' \
            "${TEST_DIR}/artifacts/chain-audit.json"
          (cd "${TEST_DIR}" && supabase start)

      - name: Apply candidate migration and exercise real authorization
        shell: bash
        run: |
          set -euo pipefail
          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "${DB_CONTAINER}"

          docker exec -i "${DB_CONTAINER}" psql -X -U postgres -d postgres \
            -v ON_ERROR_STOP=1 \
            < supabase/migrations/20261017133000_lesson_presentations_stage1.sql

          docker exec -i "${DB_CONTAINER}" psql -X -U postgres -d postgres \
            -v ON_ERROR_STOP=1 \
            < tests/fixtures/lesson_presentations_integrated_rls.sql \
            > "${RUNNER_TEMP}/lesson-presentations-rls-test.log"

          grep -Fq 'LESSON_PRESENTATIONS_STAGE1B_INTEGRATED_RLS_PASSED' \
            "${RUNNER_TEMP}/lesson-presentations-rls-test.log"

          docker exec -i "${DB_CONTAINER}" psql -X -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -qAt \
            -c "select case when
                (select count(*) from public.lesson_presentations) = 0
                and (select count(*) from public.lesson_presentation_versions) = 0
                and not exists (select 1 from auth.users where email like 'lesson-stage1b-%@invalid.test')
                then 'EMPTY_AFTER_ROLLBACK' else 'TEST_DATA_REMAINED' end;" \
            | grep -Fx 'EMPTY_AFTER_ROLLBACK'

      - name: Destroy isolated Supabase instance
        if: always()
        shell: bash
        run: |
          TEST_DIR="${RUNNER_TEMP}/lesson-presentations-stage1b"
          if [[ -f "${TEST_DIR}/supabase/config.toml" ]]; then
            (cd "${TEST_DIR}" && supabase stop --no-backup)
          fi
