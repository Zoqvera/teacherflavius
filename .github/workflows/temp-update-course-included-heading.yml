name: Temporary course included heading update

on:
  push:
    paths:
      - '.github/workflows/temp-update-course-included-heading.yml'

permissions:
  contents: write

jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Update heading and remove temporary workflow
        shell: python
        run: |
          from pathlib import Path

          page = Path('curso-de-ingles-online/index.html')
          old = 'Um curso de inglês online pensado para acompanhamento próximo.'
          new = 'Um curso de inglês pensado para acompanhamento próximo'
          text = page.read_text(encoding='utf-8')
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one match, found {count}.')
          page.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/temp-update-course-included-heading.yml').unlink()
      - name: Commit change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add curso-de-ingles-online/index.html .github/workflows/temp-update-course-included-heading.yml
          git commit -m 'content: simplify included section heading'
          git push
