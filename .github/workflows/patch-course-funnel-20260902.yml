name: Patch course funnel details 20260902

on:
  push:
    paths:
      - ".github/workflows/patch-course-funnel-20260902.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enrich public course funnel
        shell: python
        run: |
          from pathlib import Path

          path = Path("curso-de-ingles-online/index.html")
          html = path.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global html
              if new in html:
                  return
              if old not in html:
                  raise SystemExit(f"Anchor not found: {label}")
              html = html.replace(old, new, 1)

          # Dedicated styles for the live-vacancy block.
          style_anchor = '<link id="teacher-flavius-brand-palette" rel="stylesheet" href="/brand_palette.css?v=20260820-3">'
          style_link = style_anchor + '\n  <link rel="stylesheet" href="/course_funnel.css?v=20260902-1">'
          replace_once(style_anchor, style_link, "course funnel stylesheet")

          # Highest-value decision details immediately in the hero.
          replace_once('<li>4 aulas ao vivo por mês</li>', '<li>4 aulas ao vivo de 60 minutos por mês</li>', "hero class duration")
          replace_once('<li>Material de apoio</li>', '<li>Material e plataforma incluídos</li>', "hero platform")
          replace_once('<li>Cronograma de estudos</li>', '<li>Sem taxa de matrícula ou fidelidade</li>', "hero commitment")
          replace_once(
              '<p>por mês, com quatro aulas online e ao vivo.</p>\n          <p><strong>Professor:</strong>',
              '<p>por mês, com quatro aulas online e ao vivo de 60 minutos.</p>\n          <p><strong>Pagamento:</strong> mensalidade recorrente no Pix ou cartão. Sem taxa de matrícula, sem material cobrado à parte e sem fidelidade — você pode cancelar quando quiser.</p>\n          <p><strong>Professor:</strong>',
              "hero payment details"
          )

          # What is included: make duration explicit and surface replacement self-service.
          replace_once(
              '<article class="card"><h3>4 aulas por mês</h3><p>Encontros online e ao vivo distribuídos ao longo do mês.</p></article>',
              '<article class="card"><h3>4 aulas de 60 minutos</h3><p>Quatro encontros online e ao vivo por mês, com 60 minutos de duração cada.</p></article>',
              "included class duration"
          )
          replacement_card = '<article class="card"><h3>Reposições pelo site</h3><p>Se precisar repor uma aula, o agendamento pode ser feito diretamente no site, sem depender de troca de mensagens para organizar o horário.</p></article>'
          certificate_card = '<article class="card"><h3>Certificado por módulo</h3><p>Ao final de cada módulo, o aluno pode receber um certificado de conclusão após realizar uma avaliação final correspondente ao nível de proficiência alcançado.</p></article>'
          if replacement_card not in html:
              if certificate_card not in html:
                  raise SystemExit("Anchor not found: certificate card")
              html = html.replace(certificate_card, replacement_card + '\n          ' + certificate_card, 1)

          # Free placement assessment and CEFR-oriented outcomes.
          levels_anchor = '<ol class="levels-path" aria-label="Níveis e duração do curso">'
          leveling = '''<div class="leveling-callout">
          <h3>Nivelamento gratuito antes de escolher a turma</h3>
          <p>Você não precisa começar do zero. O professor envia uma avaliação online gratuita para identificar seu nível atual e orientar a escolha de uma turma compatível com o seu momento de aprendizagem.</p>
        </div>
        <ol class="levels-path" aria-label="Níveis e duração do curso">'''
          replace_once(levels_anchor, leveling, "placement assessment")
          replace_once('<h3>Iniciante</h3>', '<h3>Iniciante · A1/A2</h3>', "beginner CEFR label")
          replace_once('<p class="level-note">Primeira etapa do percurso.</p>', '<p class="level-note">Em geral, o aluno aprende a se apresentar, falar de rotina, família, preferências e necessidades imediatas; fazer perguntas simples; lidar com compras, viagens e serviços básicos; e participar de conversas curtas sobre situações familiares.</p>', "beginner outcomes")
          replace_once('<h3>Intermediário</h3>', '<h3>Intermediário · B1/B2</h3>', "intermediate CEFR label")
          replace_once('<p class="level-note">Segunda etapa do percurso.</p>', '<p class="level-note">Em geral, o aluno passa a relatar experiências, explicar planos, defender opiniões, resolver situações de viagem e trabalho, sustentar conversas com mais espontaneidade e compreender as ideias principais de textos e falas mais complexos.</p>', "intermediate outcomes")
          replace_once('<h3>Avançado</h3>', '<h3>Avançado · C1/C2</h3>', "advanced CEFR label")
          replace_once('<p class="level-note">Etapa mais longa, correspondente à metade do percurso completo.</p>', '<p class="level-note">Em geral, o aluno desenvolve comunicação fluente e precisa, adapta o registro ao contexto, compreende textos e falas exigentes — inclusive sentidos implícitos —, discute temas complexos e se comunica com alto grau de autonomia em ambientes profissionais, acadêmicos e sociais.</p>', "advanced outcomes")

          # Journey and student platform: answer "what happens next?" and make the digital ecosystem tangible.
          groups_anchor = '    <section class="section" aria-labelledby="groups-title">'
          journey_platform = '''    <section class="section alt" aria-labelledby="journey-title">
      <div class="shell">
        <div class="section-head">
          <p class="eyebrow">Do primeiro contato à primeira aula</p>
          <h2 id="journey-title">Uma jornada simples para entrar na turma certa.</h2>
          <p>Você conhece o curso antes de assumir qualquer compromisso e recebe orientação em cada etapa.</p>
        </div>
        <div class="steps">
          <article class="step"><h3>Aula experimental</h3><p>Conheça o formato ao vivo e veja como funciona a dinâmica das aulas.</p></article>
          <article class="step"><h3>Nivelamento gratuito</h3><p>O professor envia uma avaliação online para identificar seu nível atual.</p></article>
          <article class="step"><h3>Escolha da turma</h3><p>Com o nível definido, você verifica os horários e escolhe uma turma compatível.</p></article>
          <article class="step"><h3>Matrícula</h3><p>A matrícula é feita sem taxa de adesão e sem fidelidade contratual.</p></article>
          <article class="step"><h3>Acesso à área do estudante</h3><p>Você recebe acesso à plataforma com os recursos do curso e sua rotina de estudos.</p></article>
          <article class="step"><h3>Início das aulas</h3><p>Você entra na turma e começa a participar dos encontros semanais de 60 minutos.</p></article>
        </div>
      </div>
    </section>

    <section class="section" aria-labelledby="platform-title">
      <div class="shell">
        <div class="section-head">
          <p class="eyebrow">Além da aula ao vivo</p>
          <h2 id="platform-title">O curso continua dentro da plataforma teacherflavius.com.</h2>
          <p>A Área do Estudante organiza o que você precisa fazer entre as aulas e concentra ferramentas acadêmicas e administrativas em um só lugar.</p>
        </div>
        <div class="grid cols-3">
          <article class="card platform-card"><strong>Minha Semana</strong><p>Visualize aulas, atividades e as prioridades da semana.</p></article>
          <article class="card platform-card"><strong>Portal de Exercícios</strong><p>Acesse atividades propostas e mantenha uma rotina prática de estudo.</p></article>
          <article class="card platform-card"><strong>Roteiro, flashcards e gramática</strong><p>Use materiais de revisão e ferramentas para ampliar vocabulário e consolidar estruturas.</p></article>
          <article class="card platform-card"><strong>Meu Progresso</strong><p>Acompanhe sua evolução e os registros do percurso no curso.</p></article>
          <article class="card platform-card"><strong>Turma, frequência e horários</strong><p>Consulte informações da sua turma, presença e horários disponíveis diretamente no portal.</p></article>
          <article class="card platform-card"><strong>Reposições e mensalidades</strong><p>Agende reposições e acompanhe pagamentos sem sair da Área do Estudante.</p></article>
        </div>
      </div>
    </section>

'''
          if 'id="journey-title"' not in html:
              if groups_anchor not in html:
                  raise SystemExit("Anchor not found: groups section")
              html = html.replace(groups_anchor, journey_platform + groups_anchor, 1)

          # Comparison table: make operational and financial conditions explicit.
          replace_once('<tr><td>4 aulas por mês</td><td class="yes">Sim</td></tr>', '<tr><td>4 aulas por mês</td><td class="yes">Sim</td></tr>\n              <tr><td>Duração de cada aula</td><td class="yes">60 minutos</td></tr>', "comparison duration")
          replace_once('<tr><td>Cronograma de estudos</td><td class="yes">Incluído</td></tr>', '<tr><td>Cronograma de estudos</td><td class="yes">Incluído</td></tr>\n              <tr><td>Reposição de aulas</td><td class="yes">Agendamento pelo site</td></tr>', "comparison replacements")
          payment_rows = '<tr><td>Pagamento</td><td class="yes">Pix ou cartão</td></tr>\n              <tr><td>Fidelidade</td><td class="yes">Não</td></tr>\n              <tr><td>Taxa de matrícula</td><td class="yes">Não</td></tr>'
          investment_row = '<tr><td>Investimento mensal</td><td class="yes">R$ 99,90</td></tr>'
          if payment_rows not in html:
              if investment_row not in html:
                  raise SystemExit("Anchor not found: investment row")
              html = html.replace(investment_row, payment_rows + '\n              ' + investment_row, 1)

          # Payment conditions and live vacancies close to the bottom-of-funnel CTA.
          faq_anchor = '    <section class="section alt" aria-labelledby="faq-title">'
          payment_vacancies = '''    <section class="section alt" aria-labelledby="payment-title">
      <div class="shell">
        <div class="section-head">
          <p class="eyebrow">Pagamento e cancelamento</p>
          <h2 id="payment-title">Mensalidade simples, sem taxa de matrícula e sem fidelidade.</h2>
          <p>As condições são apresentadas de forma clara para que você saiba exatamente o que está contratando.</p>
        </div>
        <div class="grid cols-2">
          <article class="card"><h3>Mensalidade recorrente</h3><p>O curso funciona por mensalidade, atualmente no valor de R$ 99,90.</p></article>
          <article class="card"><h3>Pix ou cartão</h3><p>Você pode pagar a mensalidade por Pix ou cartão.</p></article>
          <article class="card"><h3>Sem fidelidade</h3><p>Não existe período mínimo de permanência. Você pode cancelar quando quiser.</p></article>
          <article class="card"><h3>Sem custos adicionais de entrada</h3><p>Não há taxa de matrícula e o material de apoio não é cobrado à parte.</p></article>
        </div>
      </div>
    </section>

    <section class="section" aria-labelledby="vacancies-title">
      <div class="shell">
        <div class="section-head">
          <p class="eyebrow">Vagas disponíveis agora</p>
          <h2 id="vacancies-title">Veja quais turmas em grupo já estão em andamento e ainda têm vaga.</h2>
          <p id="liveVacanciesSummary">Consultando a disponibilidade atual das turmas...</p>
        </div>
        <div id="liveVacanciesList" class="vacancy-public-grid" aria-live="polite">
          <div class="vacancy-empty">Carregando vagas disponíveis...</div>
        </div>
        <p class="funnel-small-note">A lista é atualizada automaticamente a partir das matrículas registradas no sistema. Para esta vitrine, aparecem apenas turmas classificadas como quarteto, ativas, com pelo menos dois alunos e ainda com vagas disponíveis.</p>
        <div class="funnel-inline-cta"><a class="btn btn-primary" href="https://wa.me/5534998349756?text=Ol%C3%A1%2C%20gostaria%20de%20marcar%20uma%20aula%20experimental." target="_blank" rel="noopener noreferrer">QUERO CONHECER UMA TURMA</a></div>
      </div>
    </section>

'''
          if 'id="payment-title"' not in html:
              if faq_anchor not in html:
                  raise SystemExit("Anchor not found: FAQ section")
              html = html.replace(faq_anchor, payment_vacancies + faq_anchor, 1)

          # FAQ: resolve final objections close to conversion.
          cost_faq = '<article class="faq-item"><h3>Quanto custa o curso de inglês online?</h3><p>O investimento atual é de R$ 99,90 por mês, sujeito à disponibilidade de vagas nas turmas.</p></article>'
          extra_faqs = '''<article class="faq-item"><h3>Quanto tempo dura cada aula?</h3><p>Cada encontro ao vivo tem 60 minutos de duração. O plano mensal inclui quatro aulas.</p></article>
          <article class="faq-item"><h3>Como funciona o nivelamento?</h3><p>O professor envia gratuitamente uma avaliação online para identificar seu nível atual e orientar a escolha de uma turma adequada.</p></article>
          <article class="faq-item"><h3>Posso fazer reposição se faltar?</h3><p>Sim. Os alunos podem marcar reposições de aulas diretamente pelo site, usando a área própria de reposições da plataforma.</p></article>
          <article class="faq-item"><h3>Como funcionam pagamento e cancelamento?</h3><p>A cobrança é uma mensalidade recorrente, paga por Pix ou cartão. Não há fidelidade: você pode cancelar quando quiser. Também não existe taxa de matrícula e o material não é cobrado à parte.</p></article>
          <article class="faq-item"><h3>O que encontro na Área do Estudante?</h3><p>A plataforma reúne Minha Semana, Portal de Exercícios, roteiro de estudos, flashcards, aulas de gramática, acompanhamento de progresso, informações da turma, frequência, horários, reposições e mensalidades.</p></article>'''
          if '<h3>Como funciona o nivelamento?</h3>' not in html:
              if cost_faq not in html:
                  raise SystemExit("Anchor not found: cost FAQ")
              html = html.replace(cost_faq, extra_faqs + '\n          ' + cost_faq, 1)

          # Live-vacancy data: no Supabase SDK needed, only the existing public config and a small renderer.
          footer_script = '  <script defer src="/site_footer.js?v=20260820-ux-1"></script>'
          vacancy_scripts = '  <script src="/supabase_config.js?v=20260902-1"></script>\n  <script defer src="/course_vacancies.js?v=20260902-1"></script>\n' + footer_script
          replace_once(footer_script, vacancy_scripts, "vacancy scripts")

          path.write_text(html, encoding="utf-8")

      - name: Commit funnel improvements
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- curso-de-ingles-online/index.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "Zoqvera Development Automation"
          git config user.email "actions@users.noreply.github.com"
          git add curso-de-ingles-online/index.html
          git commit -m "feat: add decision details and live vacancies to course funnel"
          git push origin HEAD:main
