name: Fast critical changes gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: fast-critical-changes-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fast-critical-changes:
    name: Fast critical changes gate
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Check out pull-request merge commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Verify fast gate classification and migration immutability
        run: python3 -m unittest discover -s tests -p test_fast_critical_changes_gate.py

      - name: Run only relevant, credential-free critical contracts
        run: python3 scripts/check_fast_critical_changes_gate.py --base HEAD^1 --head HEAD
