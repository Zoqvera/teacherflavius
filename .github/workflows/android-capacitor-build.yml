name: Android Capacitor build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "capacitor.config.json"
      - "package.json"
      - "pwa_registration.js"
      - "pwa_install_prompt.js"
      - "site.webmanifest"
      - "scripts/**"
      - ".github/workflows/android-capacitor-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build bundled web application
        run: npm run mobile:web

      - name: Validate native route preparation
        shell: bash
        run: |
          test -f _android_site/index.html
          test -f _android_site/login/index.html
          grep -q '/login/index.html?next=/area-do-estudante/index.html' _android_site/index.html
          grep -q 'Consulte suas mensalidades' _android_site/pagamento/index.html
          ! grep -q 'sdk.mercadopago.com' _android_site/pagamento/index.html
          ! grep -q 'subscription_checkout.js' _android_site/pagamento/index.html
          grep -q 'href="/o-que-fazer/index.html"' _android_site/area_do_estudante.html

      - name: Assert presentations are bundled for Android lesson routes
        shell: bash
        run: |
          set -euo pipefail
          test -f _android_site/lesson_presentation_editor.js
          test -f _android_site/teacher_lesson_presentations.js
          grep -Fq 'const RELEASE_ENABLED = true;' _android_site/lesson_presentation_editor.js
          grep -Fq 'const RELEASE_ENABLED = true;' _android_site/teacher_lesson_presentations.js
          test -f _android_site/licao/index.html
          test -f _android_site/roteiro-da-aula/index.html
          test -f _android_site/roteiro-da-aula-legado/index.html
          grep -Fq '/roteiro-da-aula-v2/app.js?v=20261025-etapa7c2' _android_site/roteiro-da-aula/index.html
          grep -Fq 'href="/roteiro-da-aula-legado/"' _android_site/roteiro-da-aula/index.html
          grep -Fq '/roteiro-da-aula/app.js?v=20261022-previous-studies-1' _android_site/roteiro-da-aula-legado/index.html
          grep -Fq 'lesson_presentation_editor.js?v=20261022-apresentacoes-1' _android_site/licao/index.html
          grep -Fq 'teacher_lesson_presentations.js?v=20261020-always-visible-1' _android_site/roteiro-da-aula/index.html
          grep -Fq 'noindex,nofollow' _android_site/licao/index.html
          grep -Fq 'noindex, nofollow' _android_site/roteiro-da-aula/index.html

      - name: Generate Android project
        run: npx cap add android

      - name: Configure OAuth deep link
        run: python3 scripts/configure_android_deep_link.py

      - name: Synchronize Capacitor Android
        run: npx cap sync android

      - name: Configure Android release
        run: python3 scripts/configure_android_release.py

      - name: Configure release signing
        id: release-signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] &&              [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] &&              [ -n "${ANDROID_KEY_ALIAS:-}" ] &&              [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            python3 scripts/configure_android_signing.py
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "Android signing secrets are not configured; release will remain unsigned."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate native project
        shell: bash
        run: |
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/build.gradle
          grep -q 'com.teacherflavius.app' android/app/build.gradle
          grep -q 'android:scheme="com.teacherflavius.app"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:host="login-callback"' android/app/src/main/AndroidManifest.xml
          grep -q '@capacitor/app' android/app/src/main/assets/capacitor.plugins.json
          grep -q '@capacitor/browser' android/app/src/main/assets/capacitor.plugins.json
          test -f android/app/src/main/assets/public/index.html
          grep -q '/login/index.html?next=/area-do-estudante/index.html' android/app/src/main/assets/public/index.html
          grep -q '/native_auth_bridge.js?v=20261004-1' android/app/src/main/assets/public/index.html
          grep -q 'native_callback=1' android/app/src/main/assets/public/login.html
          grep -q 'Consulte suas mensalidades' android/app/src/main/assets/public/pagamento/index.html
          ! grep -q 'sdk.mercadopago.com' android/app/src/main/assets/public/pagamento/index.html
          grep -q 'isNativeCapacitorApp' android/app/src/main/assets/public/clean_urls.js
          grep -q 'href="/o-que-fazer/index.html"' android/app/src/main/assets/public/area_do_estudante.html
          python3 - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("mobile/android_release.json").read_text(encoding="utf-8"))
          gradle = Path("android/app/build.gradle").read_text(encoding="utf-8")
          assert f"versionCode {config['versionCode']}" in gradle
          assert f'versionName "{config["versionName"]}"' in gradle
          PY
          test -f android/app/src/main/assets/public/student_acquisition_prompt.js
          test -f android/app/src/main/assets/public/student_acquisition_prompt.css
          grep -q 'student_acquisition_prompt.js' android/app/src/main/assets/public/area_do_estudante.html
          grep -q 'studentAcquisitionPrompt' android/app/src/main/assets/public/area_do_estudante.html
          grep -q 'value: "getninjas"' android/app/src/main/assets/public/student_acquisition.js
          test -f android/app/src/main/res/drawable/ic_teacher_flavio_foreground.xml
          test -f android/app/src/main/res/drawable/splash.xml
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          if [ "${{ steps.release-signing.outputs.configured }}" = "true" ]; then
            grep -q 'signingConfig signingConfigs.release' android/app/build.gradle
            test -f android/keystore/teacher-flavio-upload.jks
          fi

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Validate debug APK
        run: test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Validate release AAB
        run: test -f android/app/build/outputs/bundle/release/app-release.aab

      - name: Verify signed release AAB
        if: steps.release-signing.outputs.configured == 'true'
        shell: bash
        run: jarsigner -verify -certs android/app/build/outputs/bundle/release/app-release.aab

      - name: Verify upload certificate fingerprint
        if: steps.release-signing.outputs.configured == 'true'
        shell: bash
        run: |
          EXPECTED_SHA256="$(python3 -c 'import json; print(json.load(open("mobile/android_release.json"))["uploadCertificateSha256"])')"
          ACTUAL_SHA256="$(keytool -printcert -jarfile android/app/build/outputs/bundle/release/app-release.aab | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1)"
          test -n "$ACTUAL_SHA256"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: teacher-flavio-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload signed release AAB
        if: success() && steps.release-signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: teacher-flavio-android-release-signed
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7

      - name: Upload unsigned release AAB
        if: success() && steps.release-signing.outputs.configured != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: teacher-flavio-android-release-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
