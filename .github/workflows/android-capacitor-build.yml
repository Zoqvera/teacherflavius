name: Android Capacitor build

on:
  pull_request:
    paths:
      - "capacitor.config.json"
      - "package.json"
      - "pwa_registration.js"
      - "pwa_install_prompt.js"
      - "native_auth_bridge.js"
      - "login.html"
      - "supabase_client_service.js"
      - "auth_infrastructure.js"
      - "site.webmanifest"
      - "assets/favicon.svg"
      - "mobile/android_release.json"
      - "scripts/**"
      - "tests/test_capacitor_android_contract.py"
      - "tests/test_prepare_android_web.py"
      - ".github/workflows/android-capacitor-build.yml"
  push:
    branches:
      - main
    paths:
      - "capacitor.config.json"
      - "package.json"
      - "pwa_registration.js"
      - "pwa_install_prompt.js"
      - "site.webmanifest"
      - "scripts/**"
      - ".github/workflows/android-capacitor-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build bundled web application
        run: npm run mobile:web

      - name: Validate native route preparation
        shell: bash
        run: |
          test -f _android_site/index.html
          test -f _android_site/login/index.html
          grep -q '/login/index.html?next=/area-do-estudante/index.html' _android_site/index.html
          grep -q 'href="/o-que-fazer/index.html"' _android_site/area_do_estudante.html

      - name: Generate Android project
        run: npx cap add android

      - name: Configure OAuth deep link
        run: python3 scripts/configure_android_deep_link.py

      - name: Synchronize Capacitor Android
        run: npx cap sync android

      - name: Configure Android release
        run: python3 scripts/configure_android_release.py

      - name: Validate native project
        shell: bash
        run: |
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/build.gradle
          grep -q 'com.teacherflavius.app' android/app/build.gradle
          grep -q 'android:scheme="com.teacherflavius.app"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:host="login-callback"' android/app/src/main/AndroidManifest.xml
          grep -q '@capacitor/app' android/app/src/main/assets/capacitor.plugins.json
          grep -q '@capacitor/browser' android/app/src/main/assets/capacitor.plugins.json
          test -f android/app/src/main/assets/public/index.html
          grep -q '/login/index.html?next=/area-do-estudante/index.html' android/app/src/main/assets/public/index.html
          grep -q '/native_auth_bridge.js?v=20261004-1' android/app/src/main/assets/public/index.html
          grep -q 'native_callback=1' android/app/src/main/assets/public/login.html
          grep -q 'isNativeCapacitorApp' android/app/src/main/assets/public/clean_urls.js
          grep -q 'href="/o-que-fazer/index.html"' android/app/src/main/assets/public/area_do_estudante.html
          grep -q 'versionCode 1' android/app/build.gradle
          grep -q 'versionName "1.0.0"' android/app/build.gradle
          test -f android/app/src/main/res/drawable/ic_teacher_flavio_foreground.xml
          test -f android/app/src/main/res/drawable/splash.xml
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Validate debug APK
        run: test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Validate release AAB
        run: test -f android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: teacher-flavio-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload unsigned release AAB
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: teacher-flavio-android-release-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
