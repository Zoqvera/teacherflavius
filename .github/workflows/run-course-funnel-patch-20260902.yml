name: Run course funnel patch 20260902

on:
  push:
    paths:
      - ".github/workflows/run-course-funnel-patch-20260902.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/patch_course_funnel_20260902.py
      - name: Commit funnel changes
        run: |
          set -euo pipefail
          if git diff --quiet -- curso-de-ingles-online/index.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "Zoqvera Development Automation"
          git config user.email "actions@users.noreply.github.com"
          git add curso-de-ingles-online/index.html
          git commit -m "feat: add decision details and live vacancies to course funnel"
          git push origin HEAD:main
