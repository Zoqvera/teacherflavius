name: Lesson presentation teacher receipt stage 3

on:
  pull_request:
    paths:
      - "supabase/migrations/*lesson_presentation_views_stage3.sql"
      - "teacher_lesson_presentations.js"
      - "teacher_lesson_presentations.css"
      - "roteiro-da-aula/**"
      - "tests/teacher_lesson_presentations.test.js"
      - "tests/fixtures/lesson_presentation_views_stage3_rls.sql"
      - ".github/workflows/lesson-presentations-stage3-contract.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/*lesson_presentation_views_stage3.sql"
      - "teacher_lesson_presentations.js"
      - "teacher_lesson_presentations.css"
      - "roteiro-da-aula/**"
      - "tests/teacher_lesson_presentations.test.js"
      - "tests/fixtures/lesson_presentation_views_stage3_rls.sql"

permissions:
  contents: read

jobs:
  teacher-receipt-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Verify teacher controls and locked release
        run: |
          node --check teacher_lesson_presentations.js
          node --check roteiro-da-aula/app.js
          node --test tests/teacher_lesson_presentations.test.js
          grep -Fq 'const RELEASE_ENABLED = false;' teacher_lesson_presentations.js
          grep -Fq 'const RELEASE_ENABLED = false;' lesson_presentation_editor.js

  teacher-receipt-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Build disposable canonical database without production access
        shell: bash
        run: |
          set -euo pipefail
          STAGE_DIR="${RUNNER_TEMP}/lesson-presentations-stage3"
          mkdir -p "${STAGE_DIR}"
          (cd "${STAGE_DIR}" && supabase init --force)
          python3 -m scripts.prepare_supabase_cli_replay \
            --repo-root "${GITHUB_WORKSPACE}" --staging-root "${STAGE_DIR}"
          python3 -m scripts.audit_supabase_isolated_chain \
            --repository-root "${GITHUB_WORKSPACE}" \
            --staging-root "${STAGE_DIR}" \
            --report-json "${STAGE_DIR}/artifacts/chain-audit.json"
          jq -e '.status == "LOCAL_CHAIN_VALIDATED" and .automatic_branching_safe == false' \
            "${STAGE_DIR}/artifacts/chain-audit.json"
          (cd "${STAGE_DIR}" && supabase start)
      - name: Apply scoped candidate migrations and test actual RLS
        shell: bash
        run: |
          set -euo pipefail
          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "${DB_CONTAINER}"
          for sql in \
            supabase/migrations/20261017133000_lesson_presentations_stage1.sql \
            supabase/migrations/20261017144500_lesson_presentation_views_stage3.sql
          do
            docker exec -i "${DB_CONTAINER}" psql -X -U postgres -d postgres \
              -v ON_ERROR_STOP=1 < "${sql}"
          done
          docker exec -i "${DB_CONTAINER}" psql -X -U postgres -d postgres \
            -v ON_ERROR_STOP=1 \
            < tests/fixtures/lesson_presentation_views_stage3_rls.sql \
            > "${RUNNER_TEMP}/presentation-views-test.log"
          grep -Fxq 'LESSON_PRESENTATIONS_STAGE3_RECEIPTS_PASSED' \
            "${RUNNER_TEMP}/presentation-views-test.log"
          docker exec -i "${DB_CONTAINER}" psql -X -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -qAt \
            -c "select case when
              (select count(*) from public.lesson_presentations)=0
              and (select count(*) from public.lesson_presentation_versions)=0
              and (select count(*) from public.lesson_presentation_views)=0
              and not exists (
                select 1 from auth.users where email like 'lesson-stage3-%@invalid.test'
              ) then 'EMPTY_AFTER_ROLLBACK' else 'TEST_DATA_REMAINED' end;" \
            | grep -Fxq 'EMPTY_AFTER_ROLLBACK'
      - name: Destroy disposable instance
        if: always()
        shell: bash
        run: |
          STAGE_DIR="${RUNNER_TEMP}/lesson-presentations-stage3"
          if [[ -f "${STAGE_DIR}/supabase/config.toml" ]]; then
            (cd "${STAGE_DIR}" && supabase stop --no-backup)
          fi
