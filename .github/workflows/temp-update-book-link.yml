name: Temporary book link update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-update-book-link.yml

permissions:
  contents: write

jobs:
  update-book-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Update book CTA and destination
        run: |
          python - <<'PY'
          from pathlib import Path

          store_url = "https://loja.editoracrv.com.br/produtos/traducao-e-interpretacao-automaticas-origens/?srsltid=AfmBOoo_shGtXTWv5ZvmBk4-_vXBpPXyMGESp6VFMOdRFHMaJ4vTrbQY"
          replacements = {
              Path("course_vacancies.js"): (
                  '"https://doi.org/10.24824/978854443937.1",\n      "Consultar DOI do livro"',
                  f'"{store_url}",\n      "Conheça o livro aqui"',
              ),
              Path("scripts/production_course_authority_content.py"): (
                  '<a href="https://doi.org/10.24824/978854443937.1" target="_blank" rel="noopener noreferrer">Consultar DOI do livro</a>',
                  f'<a href="{store_url}" target="_blank" rel="noopener noreferrer">Conheça o livro aqui</a>',
              ),
          }

          for path, (old, new) in replacements.items():
              content = path.read_text(encoding="utf-8")
              if content.count(old) != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {content.count(old)}")
              path.write_text(content.replace(old, new), encoding="utf-8")
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/temp-update-book-link.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "content: link course book to publisher"
          git push origin HEAD:main
