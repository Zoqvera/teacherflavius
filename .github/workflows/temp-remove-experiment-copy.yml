name: Temporary remove experiment copy

on:
  push:
    paths:
      - ".github/workflows/temp-remove-experiment-copy.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Remove public copy
        shell: python
        run: |
          from pathlib import Path
          import re

          target = "Quer experimentar antes de começar?"
          changed = []

          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts or '_site' in path.parts:
                  continue

              html = path.read_text(encoding='utf-8')
              if target not in html:
                  continue

              updated = html.replace(
                  '<section class="final-cta" aria-labelledby="final-title">',
                  '<section class="final-cta" aria-label="Aula experimental gratuita">',
              )
              updated = re.sub(
                  r'<(?P<tag>h[1-6]|p|span|div)(?P<attrs>[^>]*)>\s*'
                  + re.escape(target)
                  + r'\s*</(?P=tag)>',
                  '',
                  updated,
              )
              updated = updated.replace(target, '')

              if updated != html:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(path)

          remaining = [
              str(path)
              for path in Path('.').rglob('*.html')
              if '.git' not in path.parts
              and '_site' not in path.parts
              and target in path.read_text(encoding='utf-8')
          ]
          if remaining:
              raise SystemExit(f"Target copy still present in: {remaining}")

          print('Updated:', ', '.join(str(path) for path in changed) or 'none')
      - name: Commit public page updates
        run: |
          git config user.name "Zoqvera Development Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' '**/*.html'
          git diff --cached --quiet && exit 0
          git commit -m "fix: remove experiment prompt from public pages"
          git push
