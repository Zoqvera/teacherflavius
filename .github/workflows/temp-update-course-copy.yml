name: Temporary course copy update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-update-course-copy.yml'

permissions:
  contents: write

jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Apply requested copy changes
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path("curso-de-ingles-online/index.html"): [
                  (
                      '        <p class="funnel-small-note">A lista é atualizada automaticamente a partir das matrículas registradas no sistema.</p>\n',
                      '',
                  ),
                  (
                      '>QUERO CONHECER UMA TURMA</a>',
                      '>AGENDAR UMA AULA EXPERIMENTAL GRATUITA</a>',
                  ),
              ],
              Path("course_vacancies.js"): [
                  ('"Conheça o livro aqui"', '"Conheça o livro"'),
              ],
              Path("scripts/production_course_authority_content.py"): [
                  ('>Conheça o livro aqui</a>', '>Conheça o livro</a>'),
              ],
          }

          for path, changes in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in changes:
                  if old not in text:
                      raise SystemExit(f"Expected text not found in {path}: {old}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")

      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-update-course-copy.yml
          git add curso-de-ingles-online/index.html course_vacancies.js scripts/production_course_authority_content.py
          git commit -m "content: refine course availability CTA and book link"
          git push origin main
