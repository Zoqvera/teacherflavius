name: Temporary Google Meet copy update

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temp-update-google-meet-copy.yml

permissions:
  contents: write

jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Update course copy
        shell: python
        run: |
          from pathlib import Path

          path = Path("curso-de-ingles-online/index.html")
          old = "Os encontros acontecem online e permitem interação direta com o professor e com os colegas da turma."
          new = "Os encontros acontecem na plataforma Google Meet e permitem interação direta com o professor e com os colegas da turma."
          content = path.read_text(encoding="utf-8")
          if content.count(old) != 1:
              raise SystemExit(f"Expected exactly one target occurrence, found {content.count(old)}")
          path.write_text(content.replace(old, new), encoding="utf-8")

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temp-update-google-meet-copy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add curso-de-ingles-online/index.html .github/workflows/temp-update-google-meet-copy.yml
          git commit -m "content: mention Google Meet in live classes"
          git push
