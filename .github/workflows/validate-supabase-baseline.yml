name: Validate Supabase baseline restore

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read

jobs:
  restore-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out pull request
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Validate application database contracts
        run: |
          node --test tests/student_two_class_links_contract.test.js
          node --test tests/tuition_due_day_required_contract.test.js
          node --test tests/first_tuition_data_integrity_contract.test.js
          node --test tests/tuition_due_date_generation_conflict_contract.test.js
          node --test tests/payment_subscription_foundation.test.js
          node --test tests/payment_subscription_reconciliation.test.js
          node --test tests/payment_subscription_sandbox_contract.test.js
          node --test tests/enrollment_access_code.test.js
          node --test tests/enrollment_required_fields.test.js
          node --test tests/enrollment_class_mode_contract.test.js
          node --test tests/quintet_classification.test.js
          node --test tests/enrollment_onboarding_state_contract.test.js
          node --test tests/tuition_due_day_enrollment_fallback.test.js
          node --test tests/quintet_capacity_eight_contract.test.js
          node --test tests/quintet_capacity_nine_exceptions_contract.test.js
          node --test tests/course_vacancy_visibility_contract.test.js
          node --test tests/tuition_after_enrollment_contract.test.js
          node --test tests/lesson_credits_contract.test.js
          node --test tests/student_cancellation_seven_day_policy_contract.test.js
          node --test tests/replacement_one_available_seat_contract.test.js
          node --test tests/regular_cancellation_delivery_e2e_mock.test.js
          node --test tests/teacher_makeup_notification_contract.test.js
          node --test tests/manual_lesson_credit_grants_contract.test.js
          node --test tests/retire_legacy_makeup_flow_contract.test.js
          node --test tests/enrollment_commercial_terms_contract.test.js
          node --test tests/billing_plan_integrity_contract.test.js
          node --test tests/standard_100_four_lesson_plan_contract.test.js
          node --test tests/reviewed_legacy_billing_plan_contract.test.js
          node --test tests/first_tuition_reference_month_contract.test.js
          node --test tests/academic_lesson_workflow_contract.test.js
          node --test tests/conversation_question_cards_contract.test.js
          node --test tests/web_push_notifications.test.js
          node --test tests/tuition_release_eligibility_contract.test.js
          node --test tests/sync_next_tuition_after_billing_change_contract.test.js
          node --test tests/student_policy_notice_contract.test.js
          node --test tests/data_quality_lesson_history_contract.test.js
          node --test tests/historical_credit_integrity_contract.test.js

      - name: Attest protected teacher-v2 migration identities
        run: python3 -m unittest discover -s tests -p test_teacher_v2_migration_ledger.py

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start a clean local Supabase stack
        shell: bash
        run: |
          set -euo pipefail

          # The historical migration directory is intentionally incomplete and
          # must not be replayed for a baseline restore test.
          if [ -d supabase/migrations ]; then
            mv supabase/migrations /tmp/teacherflavius-migrations
          fi
          if [ -f supabase/seed.sql ]; then
            mv supabase/seed.sql /tmp/teacherflavius-seed.sql
          fi

          supabase init --force
          mkdir -p supabase/migrations
          supabase start

          rm -rf supabase/migrations
          if [ -d /tmp/teacherflavius-migrations ]; then
            mv /tmp/teacherflavius-migrations supabase/migrations
          fi
          if [ -f /tmp/teacherflavius-seed.sql ]; then
            mv /tmp/teacherflavius-seed.sql supabase/seed.sql
          fi

      - name: Apply production reconstruction baseline
        shell: bash
        run: |
          set -euo pipefail

          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$DB_CONTAINER"

          for file in \
            supabase/baseline/10_public_schema.sql \
            supabase/baseline/20_default_privileges.sql \
            supabase/baseline/30_platform_config.sql \
            supabase/baseline/35_preserve_referenced_auto_makeup_slots.sql \
            supabase/baseline/40_allow_gmail_dot_equivalent_student_links.sql \
            supabase/baseline/42_require_live_admin_auth_session.sql \
            supabase/baseline/45_add_study_lesson_pages.sql \
            supabase/baseline/50_enable_dynamic_study_roadmap_cards.sql \
            supabase/baseline/55_add_lesson_number_label_and_translation.sql \
            supabase/baseline/60_add_students_of_day.sql \
            supabase/baseline/65_allow_student_two_class_links.sql \
            supabase/baseline/70_add_mercado_pago_subscription_foundation.sql \
            supabase/baseline/75_add_mercado_pago_subscription_reconciliation.sql \
            supabase/baseline/80_add_mercado_pago_subscription_sandbox.sql \
            supabase/baseline/85_hide_trial_lessons_from_students_of_day.sql \
            supabase/baseline/90_add_conversation_questions.sql \
            supabase/baseline/95_unlock_next_tuition_two_days_after_payment.sql \
            supabase/baseline/100_require_enrollment_access_code.sql \
            supabase/baseline/105_require_all_enrollment_fields.sql \
            supabase/baseline/110_auto_assign_tuition_due_seven_days_after_enrollment.sql \
            supabase/baseline/115_set_quintet_capacity_eight.sql \
            supabase/baseline/120_limit_course_vacancies_to_three.sql \
            supabase/baseline/125_show_sold_out_course_classes.sql \
            supabase/baseline/130_enforce_tuition_after_enrollment.sql \
            supabase/baseline/135_allow_tuition_due_date_correction_audit.sql \
            supabase/baseline/140_lesson_credits_and_my_lessons.sql \
            supabase/baseline/145_student_sets_enrollment_commercial_terms.sql \
            supabase/baseline/150_add_academic_lesson_workflow.sql \
            supabase/baseline/150_align_first_tuition_with_lesson_start_month.sql \
            supabase/baseline/155_sync_lesson_cards_and_late_cancellation.sql \
            supabase/baseline/160_add_conversation_question_cards.sql \
            supabase/baseline/165_derive_enrollment_lessons_from_fee.sql \
            supabase/baseline/170_study_questions_individually.sql \
            supabase/baseline/175_set_first_tuition_before_first_lesson.sql \
            supabase/baseline/180_limit_first_tuition_to_next_day.sql \
            supabase/baseline/185_allow_enrollment_day_first_tuition.sql \
            supabase/baseline/190_add_pwa_web_push_notifications.sql \
            supabase/baseline/195_initialize_pwa_web_push_keys.sql \
            supabase/baseline/200_harden_web_push_vapid_bootstrap.sql \
            supabase/baseline/205_require_cancellation_policy_acceptance.sql \
            supabase/baseline/210_hide_unpaid_notice_for_prior_payers.sql \
            supabase/baseline/215_restrict_replacement_options_to_eligible_credits.sql \
            supabase/baseline/220_align_lesson_cards_with_billing_cycle.sql \
            supabase/baseline/225_expose_cancelled_lesson_seats_for_replacement.sql \
            supabase/baseline/230_support_manual_lesson_credit_grants.sql \
            supabase/baseline/235_activate_first_prepaid_tuition.sql \
            supabase/baseline/240_require_enrollment_class_mode.sql \
            supabase/baseline/245_add_enrollment_class_mode_rpc.sql \
            supabase/baseline/230_unify_lesson_cancellation_policy.sql \
            supabase/baseline/250_unify_first_tuition_due_rule.sql \
            supabase/baseline/255_canonicalize_replacement_eligibility.sql \
            supabase/baseline/260_canonicalize_replacement_credit_eligibility.sql \
            supabase/baseline/265_bind_enrollment_terms_to_access_code.sql \
            supabase/baseline/270_backend_driven_enrollment_onboarding_state.sql \
            supabase/baseline/275_fix_enrollment_billing_reference_month.sql \
            supabase/baseline/280_canonicalize_tuition_release_and_push_eligibility.sql \
            supabase/baseline/285_align_tuition_push_enqueue_with_release_eligibility.sql \
            supabase/baseline/290_revalidate_tuition_push_before_delivery.sql \
            supabase/baseline/295_show_all_conversation_questions.sql \
            supabase/baseline/300_enforce_quintet_only_group_classification.sql \
            supabase/baseline/305_persist_teacher_lesson_session_finalization.sql \
            supabase/baseline/310_retire_legacy_makeup_student_flow.sql \
            supabase/baseline/315_separate_lesson_and_enrollment_cancellation.sql \
            supabase/baseline/320_enforce_replacement_weekday_separation.sql \
            supabase/baseline/325_normalize_billing_plans_and_legacy_settings.sql \
            supabase/baseline/330_add_reviewed_legacy_billing_plan.sql \
            supabase/baseline/335_class_lesson_history_quality_semantics.sql \
            supabase/baseline/340_enforce_unique_tuition_due_dates_per_student.sql \
            supabase/baseline/345_aggregate_csp_health_by_logical_group.sql \
            supabase/baseline/350_student_reviews_and_public_testimonials.sql \
            supabase/baseline/355_student_paid_tuition_history.sql \
            supabase/baseline/360_prevent_new_tuition_for_archived_students.sql \
            supabase/baseline/365_guard_first_tuition_due_date.sql \
            supabase/baseline/370_avoid_tuition_due_date_generation_conflicts.sql \
            supabase/baseline/375_preserve_historical_credits_and_profile_integrity.sql \
            supabase/baseline/377_manual_replacement_credits_all_students.sql \
            supabase/baseline/380_same_day_first_tuition_payment.sql \
            supabase/baseline/385_expand_quintet_classes_8_and_17_to_nine.sql \
            supabase/baseline/390_expose_study_button_marker.sql \
            supabase/baseline/395_student_review_invitation_funnel.sql \
            supabase/baseline/400_justify_attended_cancelled_lesson_revocations.sql \
            supabase/baseline/405_restore_auth_account_health_run_storage.sql \
            supabase/baseline/415_reconcile_canonical_policy_modes.sql \
            supabase/baseline/420_reconcile_financial_mfa_policies.sql \
            supabase/baseline/425_restore_roadmap_teacher_and_exercise_read_policies.sql \
            supabase/baseline/430_restore_lgpd_privacy_catalog_stage1d5.sql \
            supabase/baseline/435_late_payment_policy_quote_foundation.sql \
            supabase/baseline/440_late_payment_settlement_gateway.sql \
            supabase/baseline/445_deactivate_late_payment_policy.sql \
            supabase/baseline/450_sync_next_tuition_after_billing_change.sql \
            supabase/baseline/455_add_standard_100_four_lesson_plan.sql \
            supabase/baseline/460_authorized_invites_do_not_request_manual_code.sql \
            supabase/baseline/465_allow_replacement_with_one_operational_vacancy.sql \
            supabase/baseline/470_limit_student_cancellations_to_seven_days.sql
          do
            echo "Applying $file"
            docker exec -i "$DB_CONTAINER" \
              psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
              < "$file"
          done

          # Production secret values are never used in CI. A dummy value only
          # verifies that the required Vault object can be provisioned.
          docker exec -i "$DB_CONTAINER" \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          select vault.create_secret(
            'restore-test-placeholder-not-a-production-secret',
            'teacherflavius_notification_webhook_secret',
            'Temporary value used only by the baseline restore CI test'
          );
          select vault.create_secret(
            'restore-test-vapid-private-key',
            'teacherflavius_web_push_vapid_private_key',
            'Temporary VAPID value used only by the baseline restore CI test'
          );
          SQL

      - name: Verify justified credit revocation overlay and RLS in disposable database
        shell: bash
        run: |
          set -euo pipefail
          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$DB_CONTAINER"
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres \
            -v ON_ERROR_STOP=1 <<'SQL'
          do $credit_overlay$
          begin
            if to_regclass('private.lesson_credit_revocation_justifications') is null
              or to_regprocedure('public.justify_teacher_attended_cancelled_lesson(uuid)') is null then
              raise exception 'Credit justification schema or teacher RPC missing';
            end if;
            if not exists (
              select 1 from pg_class c join pg_namespace n on n.oid=c.relnamespace
              where n.nspname='private'
                and c.relname='lesson_credit_revocation_justifications'
                and c.relrowsecurity
            ) then
              raise exception 'Credit justification table requires RLS';
            end if;
            if has_table_privilege('anon', 'private.lesson_credit_revocation_justifications', 'SELECT')
               or has_table_privilege('authenticated', 'private.lesson_credit_revocation_justifications', 'SELECT')
               or has_function_privilege('anon', 'public.justify_teacher_attended_cancelled_lesson(uuid)', 'EXECUTE') then
              raise exception 'Unsafe browser grants on credit justification objects';
            end if;
            if not has_function_privilege('authenticated',
                'public.justify_teacher_attended_cancelled_lesson(uuid)', 'EXECUTE') then
              raise exception 'Teacher-facing RPC not executable by authenticated role';
            end if;
          end;
          $credit_overlay$;
          SQL

      - name: Verify private Auth health storage and role grants
        shell: bash
        run: |
          set -euo pipefail
          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$DB_CONTAINER"
          docker exec -i "$DB_CONTAINER" psql -X -U postgres -d postgres \
            -v ON_ERROR_STOP=1 <<'SQL'
          do $auth_health_storage$
          begin
            if to_regclass('private.auth_account_health_runs') is null then
              raise exception 'Missing Auth health storage table';
            end if;
            if to_regclass('private.auth_account_health_runs_completed_at_idx') is null then
              raise exception 'Missing Auth health storage retention index';
            end if;
            if has_table_privilege('anon', 'private.auth_account_health_runs', 'SELECT')
              or has_table_privilege('authenticated', 'private.auth_account_health_runs', 'SELECT')
              or not has_table_privilege('service_role', 'private.auth_account_health_runs', 'SELECT')
              or not has_table_privilege('service_role', 'private.auth_account_health_runs', 'INSERT')
              or not has_table_privilege('service_role', 'private.auth_account_health_runs', 'UPDATE')
              or not has_table_privilege('service_role', 'private.auth_account_health_runs', 'DELETE')
            then
              raise exception 'Unsafe or missing Auth health storage grants';
            end if;
            if (select c.relrowsecurity from pg_class c
              where c.oid='private.auth_account_health_runs'::regclass) then
              raise exception 'Auth health private table RLS deviates from reviewed production schema';
            end if;
          end
          $auth_health_storage$;
          SQL

      - name: Verify lesson-page MFA invariants
        shell: bash
        run: |
          set -euo pipefail
          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$DB_CONTAINER"
          docker exec -i "$DB_CONTAINER" psql -X -U postgres -d postgres \
            -v ON_ERROR_STOP=1 < tests/sql/canonical_lesson_page_mfa.sql

      - name: Verify financial MFA policies against production posture
        shell: bash
        run: |
          set -euo pipefail
          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$DB_CONTAINER"
          docker exec -i "$DB_CONTAINER" \
            psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < tests/sql/canonical_financial_mfa_stage1d4.sql

      - name: Verify restored academic RLS in disposable PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$DB_CONTAINER"
          docker exec -i "$DB_CONTAINER" psql -X -U postgres -d postgres \
            -v ON_ERROR_STOP=1 < tests/sql/canonical_roadmap_exercise_policies_stage1d4b.sql

      - name: Verify LGPD catalog ACLs and student RLS with synthetic PostgreSQL data
        shell: bash
        run: |
          set -euo pipefail
          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$DB_CONTAINER"
          docker exec -i "$DB_CONTAINER" psql -X -U postgres -d postgres \
            -v ON_ERROR_STOP=1 < tests/sql/canonical_lgpd_privacy_stage1d5.sql

      - name: Verify least-privilege browser ACLs
        shell: bash
        run: |
          set -euo pipefail

          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$DB_CONTAINER"

          docker exec -i "$DB_CONTAINER" \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          do $acl_check$
          declare
            dangerous_grants integer;
            anon_table_grants integer;
          begin
            select count(*)
              into dangerous_grants
            from pg_class c
            join pg_namespace n on n.oid = c.relnamespace
            where n.nspname = 'public'
              and c.relkind in ('r','p')
              and (
                has_table_privilege('anon', c.oid, 'TRUNCATE')
                or has_table_privilege('anon', c.oid, 'REFERENCES')
                or has_table_privilege('anon', c.oid, 'TRIGGER')
                or has_table_privilege('anon', c.oid, 'MAINTAIN')
                or has_table_privilege('authenticated', c.oid, 'TRUNCATE')
                or has_table_privilege('authenticated', c.oid, 'REFERENCES')
                or has_table_privilege('authenticated', c.oid, 'TRIGGER')
                or has_table_privilege('authenticated', c.oid, 'MAINTAIN')
              );

            if dangerous_grants <> 0 then
              raise exception 'Baseline restored % tables with dangerous browser grants.', dangerous_grants;
            end if;

            select count(*)
              into anon_table_grants
            from information_schema.role_table_grants
            where table_schema = 'public'
              and grantee = 'anon';

            if anon_table_grants <> 0 then
              raise exception 'Historical baseline must restore with zero direct anonymous table grants; found %.', anon_table_grants;
            end if;
          end;
          $acl_check$;
          SQL

      - name: Verify makeup-slot synchronizer preserves booking history
        shell: bash
        run: |
          set -euo pipefail

          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$DB_CONTAINER"

          FUNCTION_DEF="$(docker exec "$DB_CONTAINER" \
            psql -U postgres -d postgres -At -v ON_ERROR_STOP=1 \
            -c "select pg_get_functiondef('public.sync_auto_makeup_slots_30_days()'::regprocedure);")"

          printf '%s\n' "$FUNCTION_DEF" | grep -F 'where b.slot_id = s.id'
          if printf '%s\n' "$FUNCTION_DEF" | sed -n \
            '/delete from public.makeup_class_slots s/,/get diagnostics deleted_count = row_count;/p' \
            | grep -Fq "b.status = 'confirmed'"
          then
            echo '::error::Baseline synchronizer can still delete slots referenced by non-confirmed booking history.'
            exit 1
          fi

      - name: Verify students-of-day excludes trial appointments
        shell: bash
        run: |
          set -euo pipefail

          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$DB_CONTAINER"

          FUNCTION_DEF="$(docker exec "$DB_CONTAINER" \
            psql -U postgres -d postgres -At -v ON_ERROR_STOP=1 \
            -c "select pg_get_functiondef('public.get_teacher_students_of_day()'::regprocedure);")"

          printf '%s\n' "$FUNCTION_DEF" | grep -F 'regular_lessons'
          printf '%s\n' "$FUNCTION_DEF" | grep -F 'makeup_lessons'
          if printf '%s\n' "$FUNCTION_DEF" | grep -Fq 'trial_lesson_appointments'
          then
            echo '::error::Students-of-day baseline still includes trial appointments.'
            exit 1
          fi

      - name: Verify Gmail dot-equivalence account linking
        shell: bash
        run: |
          set -euo pipefail

          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$DB_CONTAINER"

          docker exec -i "$DB_CONTAINER" \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          do $gmail_link_check$
          begin
            if public.canonical_gmail_email('student.name@gmail.com')
               <> public.canonical_gmail_email('studentname@gmail.com') then
              raise exception 'Gmail dot-equivalence normalization is not active.';
            end if;

            if public.canonical_gmail_email('student.name@example.com')
               = public.canonical_gmail_email('studentname@example.com') then
              raise exception 'Dot-equivalence must not apply to non-Gmail domains.';
            end if;

            if has_function_privilege('anon', 'public.canonical_gmail_email(text)', 'EXECUTE')
               or has_function_privilege('authenticated', 'public.canonical_gmail_email(text)', 'EXECUTE') then
              raise exception 'Gmail canonicalization helper is exposed to browser roles.';
            end if;
          end;
          $gmail_link_check$;
          SQL

      - name: Verify replacement weekday separation
        shell: bash
        run: |
          set -euo pipefail

          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$DB_CONTAINER"

          docker exec -i "$DB_CONTAINER" \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          do $replacement_weekday_check$
          declare
            options_definition text;
            booking_definition text;
          begin
            if has_function_privilege(
              'anon',
              'private.is_replacement_weekday_eligible(uuid,integer)',
              'EXECUTE'
            ) or has_function_privilege(
              'authenticated',
              'private.is_replacement_weekday_eligible(uuid,integer)',
              'EXECUTE'
            ) then
              raise exception 'Replacement weekday helper is exposed to browser roles.';
            end if;

            select pg_get_functiondef(
              'public.get_my_replacement_options()'::regprocedure
            ) into options_definition;

            select pg_get_functiondef(
              'public.book_my_lesson_replacement(uuid,integer,timestamptz)'::regprocedure
            ) into booking_definition;

            if position('private.is_replacement_weekday_eligible' in options_definition) = 0 then
              raise exception 'Replacement option discovery does not enforce the canonical weekday rule.';
            end if;

            if position('private.is_replacement_weekday_eligible' in booking_definition) = 0 then
              raise exception 'Replacement booking does not enforce the canonical weekday rule.';
            end if;
          end;
          $replacement_weekday_check$;
          SQL

      - name: Verify unique tuition due-date invariant
        shell: bash
        run: |
          set -euo pipefail

          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$DB_CONTAINER"

          docker exec -i "$DB_CONTAINER" \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          do $tuition_due_date_check$
          begin
            if not exists (
              select 1
              from pg_constraint constraint_row
              join pg_class table_row
                on table_row.oid = constraint_row.conrelid
              join pg_namespace schema_row
                on schema_row.oid = table_row.relnamespace
              where schema_row.nspname = 'public'
                and table_row.relname = 'monthly_tuition'
                and constraint_row.conname = 'monthly_tuition_student_id_due_date_key'
                and constraint_row.contype = 'u'
            ) then
              raise exception 'Unique tuition due-date invariant is missing.';
            end if;
          end;
          $tuition_due_date_check$;
          SQL

      - name: Verify tuition generator conflict handling
        shell: bash
        run: |
          set -euo pipefail

          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$DB_CONTAINER"

          FUNCTION_DEF="$(docker exec "$DB_CONTAINER" \
            psql -U postgres -d postgres -At -v ON_ERROR_STOP=1 \
            -c "select pg_get_functiondef('public.generate_monthly_tuition__mfa_inner(date)'::regprocedure);")"

          printf '%s\n' "$FUNCTION_DEF" | grep -F 'conflicting_due.reference_month <> generated_month.reference_month::date'
