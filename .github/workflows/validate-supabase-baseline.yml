      - name: Compare restored catalog with production fingerprint
        shell: bash
        run: |
          set -euo pipefail

          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"

          docker exec -i "$DB_CONTAINER" \
            psql -U postgres -d postgres -At -v ON_ERROR_STOP=1 <<'SQL' \
            > /tmp/actual-fingerprint.json
          select json_build_object(
            'tables', (
              select count(*)
              from pg_class c
              join pg_namespace n on n.oid = c.relnamespace
              where n.nspname = 'public' and c.relkind in ('r','p')
            ),
            'constraints', (
              select count(*)
              from pg_constraint co
              join pg_namespace n on n.oid = co.connamespace
              where n.nspname = 'public'
            ),
            'non_constraint_indexes', (
              select count(*)
              from pg_index i
              join pg_class tbl on tbl.oid = i.indrelid
              join pg_namespace n on n.oid = tbl.relnamespace
              where n.nspname = 'public'
                and not exists (
                  select 1 from pg_constraint co where co.conindid = i.indexrelid
                )
            ),
            'public_functions', (
              select count(*)
              from pg_proc p
              join pg_namespace n on n.oid = p.pronamespace
              where n.nspname = 'public'
            ),
            'private_functions', (
              select count(*)
              from pg_proc p
              join pg_namespace n on n.oid = p.pronamespace
              where n.nspname = 'private'
            ),
            'rls_policies', (
              select count(*) from pg_policies where schemaname = 'public'
            ),
            'public_user_triggers', (
              select count(*)
              from pg_trigger t
              join pg_class c on c.oid = t.tgrelid
              join pg_namespace n on n.oid = c.relnamespace
              where n.nspname = 'public' and not t.tgisinternal
            ),
            'application_auth_triggers', (
              select count(*)
              from pg_trigger t
              join pg_class c on c.oid = t.tgrelid
              join pg_namespace n on n.oid = c.relnamespace
              where n.nspname = 'auth' and not t.tgisinternal
                and t.tgfoid in (
                  select p.oid
                  from pg_proc p
                  join pg_namespace pn on pn.oid = p.pronamespace
                  where pn.nspname in ('public','private')
                )
            ),
            'application_event_triggers', (
              select count(*)
              from pg_event_trigger e
              where e.evtfoid in (
                select p.oid
                from pg_proc p
                join pg_namespace n on n.oid = p.pronamespace
                where n.nspname in ('public','private')
              )
            ),
            'cron_jobs', (
              select count(*) from cron.job
              where jobname in (
                'sync-auto-makeup-slots-30-days',
                'web-push-notifications'
              )
            ),
            'storage_buckets', (
              select count(*) from storage.buckets
            ),
            'vault_secret_names', (
              select count(*) from vault.secrets
              where name in (
                'teacherflavius_notification_webhook_secret',
                'teacherflavius_web_push_cron_secret',
                'teacherflavius_web_push_vapid_private_key'
              )
            )
          );
          SQL

          jq -S 'del(.captured_from_migration_version)' \
            supabase/baseline/schema-fingerprint.json \
            > /tmp/expected-fingerprint.json
          jq -S . /tmp/actual-fingerprint.json \
            > /tmp/actual-fingerprint-normalized.json

          echo 'Expected fingerprint:'
          cat /tmp/expected-fingerprint.json
          echo 'Actual fingerprint:'
          cat /tmp/actual-fingerprint-normalized.json

          diff -u \
            /tmp/expected-fingerprint.json \
            /tmp/actual-fingerprint-normalized.json

      - name: Verify student due-review migration against complete restored schema
        shell: bash
        run: |
          set -euo pipefail

          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$DB_CONTAINER"

          docker exec -i "$DB_CONTAINER" \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/migrations/20261014194243_add_student_due_review_questions.sql

          docker exec -i "$DB_CONTAINER" \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          do $student_review_assert$
          begin
            if not pg_get_functiondef('public.get_my_action_plan()'::regprocedure)
              like '%''marked_studied'', question.marked_studied%' then
              raise exception 'Student study-button marker is missing from the action-plan RPC';
            end if;
            if to_regprocedure('public.get_my_review_questions()') is null then
              raise exception 'Student due-review RPC was not installed';
            end if;
            if has_function_privilege('anon', 'public.get_my_review_questions()', 'EXECUTE') then
              raise exception 'Anonymous users can access student reviews';
            end if;
            if not has_function_privilege(
              'authenticated', 'public.get_my_review_questions()', 'EXECUTE'
            ) then
              raise exception 'Student due-review RPC is unavailable to students';
            end if;
            if not exists (
              select 1
              from pg_proc procedure_row
              join pg_namespace schema_row on schema_row.oid = procedure_row.pronamespace
              where schema_row.nspname = 'public'
                and procedure_row.proname = 'get_my_review_questions'
                and procedure_row.prosecdef = true
                and procedure_row.proconfig @> array['search_path=""']
            ) then
              raise exception 'Student due-review RPC lacks its restricted search path';
            end if;
            begin
              perform public.get_my_review_questions();
              raise exception 'Anonymous request unexpectedly received student data';
            exception when sqlstate '42501' then null;
            end;
          end;
          $student_review_assert$;
          SQL

