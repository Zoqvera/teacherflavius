name: Materialize GTM for GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "**/*.html"
      - "scripts/inject_google_tag_manager.py"
      - ".github/workflows/materialize-gtm-github-pages.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject and validate GTM in GitHub Pages source
        run: python3 scripts/inject_google_tag_manager.py --site-root .

      - name: Commit generated HTML changes
        shell: bash
        run: |
          if git diff --quiet -- '*.html'; then
            echo "GTM source is already materialized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          git commit -m "chore: materialize GTM for GitHub Pages"
          git push origin HEAD:main
