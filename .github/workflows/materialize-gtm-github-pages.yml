name: Validate generated HTML for GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "**/*.html"
      - "scripts/html_script_dependency.py"
      - "scripts/html_script_dependency_transform.py"
      - "scripts/script_dependency_spec.py"
      - "scripts/materialize_site.py"
      - "scripts/materialization_profiles.py"
      - "scripts/inject_auth_module_loader.py"
      - "scripts/inject_site_asset_loader.py"
      - "scripts/inject_site_runtime_config.py"
      - "scripts/inject_site_page_runtime.py"
      - "scripts/inject_site_privacy_analytics.py"
      - "scripts/inject_google_tag_manager.py"
      - "scripts/google_tag_manager_html.py"
      - "scripts/materialize_clean_route_aliases.py"
      - ".github/workflows/materialize-gtm-github-pages.yml"
  pull_request:
    branches:
      - main
    paths:
      - "**/*.html"
      - "scripts/**"
      - ".github/workflows/materialize-gtm-github-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Materialize GitHub Pages HTML
        run: python3 scripts/materialize_site.py --site-root . --profile github-pages

      - name: Report generated HTML drift
        shell: bash
        run: |
          if git diff --quiet -- '*.html'; then
            echo "Generated HTML is already materialized."
            exit 0
          fi

          echo "::warning title=Generated HTML drift::Materialization produced source changes. Protected main is not mutated by this workflow."
          git diff --stat -- '*.html'
