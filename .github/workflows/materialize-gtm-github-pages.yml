name: Materialize generated HTML for GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "**/*.html"
      - "scripts/html_script_dependency.py"
      - "scripts/inject_auth_module_loader.py"
      - "scripts/inject_site_asset_loader.py"
      - "scripts/inject_site_runtime_config.py"
      - "scripts/inject_site_page_runtime.py"
      - "scripts/inject_site_privacy_analytics.py"
      - "scripts/inject_google_tag_manager.py"
      - "scripts/materialize_clean_route_aliases.py"
      - ".github/workflows/materialize-gtm-github-pages.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize auth bootstrap, site runtime, privacy analytics and GTM
        run: |
          python3 scripts/inject_auth_module_loader.py --site-root .
          python3 scripts/inject_site_asset_loader.py --site-root .
          python3 scripts/inject_site_runtime_config.py --site-root .
          python3 scripts/inject_site_page_runtime.py --site-root .
          python3 scripts/inject_site_privacy_analytics.py --site-root .
          python3 scripts/inject_google_tag_manager.py --site-root .
          python3 scripts/materialize_clean_route_aliases.py --site-root .

      - name: Commit generated HTML changes
        shell: bash
        run: |
          if git diff --quiet -- '*.html'; then
            echo "Generated HTML is already materialized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          git commit -m "chore: materialize generated GitHub Pages HTML"
          git push origin HEAD:main
