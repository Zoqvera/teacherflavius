name: Supabase canonical object inventory

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/baseline/**"
      - "scripts/compile_canonical_supabase_bootstrap.py"
      - ".github/workflows/validate-supabase-baseline.yml"
      - "scripts/sql/supabase_schema_object_inventory_readonly.sql"
      - "scripts/compare_supabase_object_inventories.py"
      - "tests/test_supabase_schema_object_inventory.py"
      - "scripts/sql/supabase_rls_policy_posture_readonly.sql"
      - "scripts/compare_supabase_rls_posture.py"
      - "tests/test_supabase_rls_posture.py"
      - "scripts/triage_missing_supabase_rls_policies.py"
      - "tests/test_supabase_rls_dependency_triage.py"
      - "tests/test_supabase_stage1d4c_audit.py"
      - "scripts/sql/supabase_sensitive_privacy_functions_readonly.sql"
      - "scripts/audit_supabase_sensitive_privacy_functions.py"
      - "tests/test_supabase_sensitive_privacy_functions.py"
      - "docs/supabase-privacy-stage1d6-snapshot.json"
      - "docs/supabase-privacy-stage1d6-audit.md"
      - "docs/supabase-rls-stage1d4c-snapshot.json"
      - "docs/supabase-rls-auditoria-etapa-1d4c.md"
      - ".github/workflows/supabase-schema-object-inventory.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/baseline/**"
      - "scripts/compile_canonical_supabase_bootstrap.py"
      - ".github/workflows/validate-supabase-baseline.yml"
      - "scripts/sql/supabase_schema_object_inventory_readonly.sql"
      - "scripts/compare_supabase_object_inventories.py"
      - "tests/test_supabase_schema_object_inventory.py"
      - "scripts/sql/supabase_rls_policy_posture_readonly.sql"
      - "scripts/compare_supabase_rls_posture.py"
      - "tests/test_supabase_rls_posture.py"
      - "scripts/triage_missing_supabase_rls_policies.py"
      - "tests/test_supabase_rls_dependency_triage.py"
      - "tests/test_supabase_stage1d4c_audit.py"
      - "scripts/sql/supabase_sensitive_privacy_functions_readonly.sql"
      - "scripts/audit_supabase_sensitive_privacy_functions.py"
      - "tests/test_supabase_sensitive_privacy_functions.py"
      - "docs/supabase-privacy-stage1d6-snapshot.json"
      - "docs/supabase-privacy-stage1d6-audit.md"
      - "docs/supabase-rls-stage1d4c-snapshot.json"
      - "docs/supabase-rls-auditoria-etapa-1d4c.md"
      - ".github/workflows/supabase-schema-object-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-object-inventory-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Test inventory parsing, privacy and comparison contracts
        run: python3 -m unittest discover -s tests -p test_supabase_schema_object_inventory.py -v
      - name: Test RLS posture comparator without remote credentials
        run: python3 -m unittest discover -s tests -p test_supabase_rls_posture.py -v
      - name: Test policy relation-dependency triage
        run: python3 -m unittest discover -s tests -p test_supabase_rls_dependency_triage.py -v
      - name: Validate stage 1D.4C audit provenance and aggregated counts
        run: python3 -m unittest discover -s tests -p test_supabase_stage1d4c_audit.py -v
      - name: Validate privileged LGPD RPC inventory contracts
        run: python3 -m unittest discover -s tests -p test_supabase_sensitive_privacy_functions.py -v

  canonical-object-comparison:
    if: github.event_name != 'pull_request'
    needs: schema-object-inventory-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Check out protected main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Fail closed without production read-only credential
        shell: bash
        run: |
          if [[ -z "${SUPABASE_DB_URL}" ]]; then
            echo "::error::SUPABASE_DB_URL is not configured."
            exit 1
          fi

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Rebuild canonical database in disposable local stack
        shell: bash
        run: |
          set -euo pipefail
          TEST_DIR="${RUNNER_TEMP}/teacherflavius-schema-1c"
          mkdir -p "${TEST_DIR}"
          (cd "${TEST_DIR}" && supabase init --force)
          python3 -m scripts.prepare_supabase_cli_replay \
            --repo-root "${GITHUB_WORKSPACE}" \
            --staging-root "${TEST_DIR}"
          python3 -m scripts.audit_supabase_isolated_chain \
            --repository-root "${GITHUB_WORKSPACE}" \
            --staging-root "${TEST_DIR}" \
            --report-json "${TEST_DIR}/artifacts/chain-audit.json"
          jq -e '.status == "LOCAL_CHAIN_VALIDATED" and
            .production_ledger_modified == false and
            .automatic_branching_safe == false' \
            "${TEST_DIR}/artifacts/chain-audit.json"
          (cd "${TEST_DIR}" && supabase start)

      - name: Compare hashed object identities without exporting SQL definitions
        shell: bash
        run: |
          set -euo pipefail
          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "${DB_CONTAINER}"

          docker exec -i "${DB_CONTAINER}" \
            psql -X -qAt -F "$(printf '\t')" -U postgres -d postgres \
            -v ON_ERROR_STOP=1 \
            < scripts/sql/supabase_schema_object_inventory_readonly.sql \
            > "${RUNNER_TEMP}/canonical-objects.tsv"

          psql "${SUPABASE_DB_URL}" -X -qAt -F "$(printf '\t')" \
            -v ON_ERROR_STOP=1 \
            -f scripts/sql/supabase_schema_object_inventory_readonly.sql \
            > "${RUNNER_TEMP}/production-objects.tsv"

          python3 -m scripts.compare_supabase_object_inventories \
            --baseline-inventory "${RUNNER_TEMP}/canonical-objects.tsv" \
            --production-inventory "${RUNNER_TEMP}/production-objects.tsv" \
            --report-json "${RUNNER_TEMP}/schema-object-gap-assessment.json"

          jq -e '.metadata_only == true and
            .raw_definitions_exported == false and
            .student_data_exported == false and
            .production_write_authorized == false and
            .migration_ledger_modified == false and
            .remote_branch_replay_verified == false and
            .complete_schema_equivalence_verified == false' \
            "${RUNNER_TEMP}/schema-object-gap-assessment.json"

      - name: Classify RLS role surfaces and predicates separately
        shell: bash
        run: |
          set -euo pipefail
          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "${DB_CONTAINER}"

          docker exec -i "${DB_CONTAINER}" \
            psql -X -qAt -F "$(printf '\t')" -U postgres -d postgres \
            -v ON_ERROR_STOP=1 \
            < scripts/sql/supabase_rls_policy_posture_readonly.sql \
            > "${RUNNER_TEMP}/canonical-rls-posture.tsv"

          psql "${SUPABASE_DB_URL}" -X -qAt -F "$(printf '\t')" \
            -v ON_ERROR_STOP=1 \
            -f scripts/sql/supabase_rls_policy_posture_readonly.sql \
            > "${RUNNER_TEMP}/production-rls-posture.tsv"

          python3 -m scripts.compare_supabase_rls_posture \
            --baseline "${RUNNER_TEMP}/canonical-rls-posture.tsv" \
            --production "${RUNNER_TEMP}/production-rls-posture.tsv" \
            --output "${RUNNER_TEMP}/rls-posture-assessment.json"

          jq -e '.expressions_exported == false and
            .student_data_exported == false and
            .production_write_authorized == false and
            .security_equivalence_verified == false and
            .remote_branch_replay_verified == false' \
            "${RUNNER_TEMP}/rls-posture-assessment.json"

      - name: Identify missing policies blocked by absent tables
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.triage_missing_supabase_rls_policies \
            --baseline-policies "${RUNNER_TEMP}/canonical-rls-posture.tsv" \
            --production-policies "${RUNNER_TEMP}/production-rls-posture.tsv" \
            --baseline-objects "${RUNNER_TEMP}/canonical-objects.tsv" \
            --output "${RUNNER_TEMP}/rls-policy-dependency-assessment.json"

          jq -e '.contains_predicates == false and
            .contains_student_records == false and
            .production_write_authorized == false and
            .security_equivalence_verified == false and
            (.missing_policies ==
              (.missing_on_absent_relations + .missing_on_restored_relations))' \
            "${RUNNER_TEMP}/rls-policy-dependency-assessment.json"

      - name: Audit privileged LGPD RPC grants without exporting SQL bodies
        shell: bash
        run: |
          set -euo pipefail
          psql "${SUPABASE_DB_URL}" -X -qAt -F "$(printf '\t')" \
            -v ON_ERROR_STOP=1 \
            -f scripts/sql/supabase_sensitive_privacy_functions_readonly.sql \
            > "${RUNNER_TEMP}/privacy-function-posture.tsv"

          python3 -m scripts.audit_supabase_sensitive_privacy_functions \
            --inventory "${RUNNER_TEMP}/privacy-function-posture.tsv" \
            --output "${RUNNER_TEMP}/privacy-function-assessment.json"

          jq -e '.metadata_only == true and
            .function_definitions_exported == false and
            .student_data_exported == false and
            .production_write_authorized == false and
            .function_authorization_verified == false and
            .mfa_enforcement_verified == false and
            .status == "PRIVACY_HIGH_PRIVILEGE_REVIEW_REQUIRED" and
            .inspected_functions == 24 and
            .authenticated_wrappers == 14 and
            .service_only_functions == 10 and
            .anon_exposed == 0 and
            .missing_search_path == 0 and
            .missing_service_execute == 0 and
            .wrong_authenticated_access == 0' \
            "${RUNNER_TEMP}/privacy-function-assessment.json"

      - name: Upload limited structural gap report only
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supabase-schema-object-gap-assessment
          path: |
            ${{ runner.temp }}/schema-object-gap-assessment.json
            ${{ runner.temp }}/rls-posture-assessment.json
            ${{ runner.temp }}/rls-policy-dependency-assessment.json
            ${{ runner.temp }}/privacy-function-assessment.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Stop isolated Supabase database
        if: always()
        shell: bash
        run: |
          TEST_DIR="${RUNNER_TEMP}/teacherflavius-schema-1c"
          if [[ -f "${TEST_DIR}/supabase/config.toml" ]]; then
            (cd "${TEST_DIR}" && supabase stop --no-backup)
          fi
