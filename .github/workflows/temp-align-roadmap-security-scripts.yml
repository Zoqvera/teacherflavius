name: Temporary align roadmap security scripts

on:
  push:
    paths:
      - ".github/workflows/temp-align-roadmap-security-scripts.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Align roadmap RLS scripts
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Expected block not found: {label}")
              return text.replace(old, new, 1)

          phase2 = Path("supabase_seguranca_fase2_rls.sql")
          sql = phase2.read_text(encoding="utf-8")
          old = '''alter policy "Alunos podem ver suas lições do roteiro"
            on public.study_roadmap_completion
            to authenticated
            using ((select auth.uid()) = user_id);

          alter policy "Alunos podem inserir suas lições do roteiro"
            on public.study_roadmap_completion
            to authenticated
            with check ((select auth.uid()) = user_id);

          alter policy "Alunos podem atualizar suas lições do roteiro"
            on public.study_roadmap_completion
            to authenticated
            using ((select auth.uid()) = user_id)
            with check ((select auth.uid()) = user_id);
'''
          new = '''alter policy "Alunos podem ver suas lições do roteiro"
            on public.study_roadmap_completion
            to authenticated
            using ((select auth.uid()) = user_id);

          drop policy if exists "Alunos podem inserir suas lições do roteiro"
            on public.study_roadmap_completion;
          drop policy if exists "Alunos podem atualizar suas lições do roteiro"
            on public.study_roadmap_completion;

          drop policy if exists "Professor pode inserir progresso do roteiro"
            on public.study_roadmap_completion;
          create policy "Professor pode inserir progresso do roteiro"
            on public.study_roadmap_completion
            for insert
            to authenticated
            with check ((select public.is_teacher_admin()));

          drop policy if exists "Professor pode atualizar progresso do roteiro"
            on public.study_roadmap_completion;
          create policy "Professor pode atualizar progresso do roteiro"
            on public.study_roadmap_completion
            for update
            to authenticated
            using ((select public.is_teacher_admin()))
            with check ((select public.is_teacher_admin()));

          drop policy if exists "Professor pode excluir progresso do roteiro"
            on public.study_roadmap_completion;
          create policy "Professor pode excluir progresso do roteiro"
            on public.study_roadmap_completion
            for delete
            to authenticated
            using ((select public.is_teacher_admin()));
'''
          sql = replace_once(sql, old, new, "phase2 roadmap policies")
          phase2.write_text(sql, encoding="utf-8")

          rollback = Path("supabase_seguranca_fase2_rls_rollback.sql")
          sql = rollback.read_text(encoding="utf-8")
          old = '''alter policy "Alunos podem ver suas lições do roteiro"
            on public.study_roadmap_completion
            to public
            using (auth.uid() = user_id);

          alter policy "Alunos podem inserir suas lições do roteiro"
            on public.study_roadmap_completion
            to public
            with check (auth.uid() = user_id);

          alter policy "Alunos podem atualizar suas lições do roteiro"
            on public.study_roadmap_completion
            to public
            using (auth.uid() = user_id)
            with check (auth.uid() = user_id);
'''
          new = '''alter policy "Alunos podem ver suas lições do roteiro"
            on public.study_roadmap_completion
            to authenticated
            using ((select auth.uid()) = user_id);

          drop policy if exists "Alunos podem inserir suas lições do roteiro"
            on public.study_roadmap_completion;
          drop policy if exists "Alunos podem atualizar suas lições do roteiro"
            on public.study_roadmap_completion;

          drop policy if exists "Professor pode inserir progresso do roteiro"
            on public.study_roadmap_completion;
          create policy "Professor pode inserir progresso do roteiro"
            on public.study_roadmap_completion
            for insert
            to authenticated
            with check ((select public.is_teacher_admin()));

          drop policy if exists "Professor pode atualizar progresso do roteiro"
            on public.study_roadmap_completion;
          create policy "Professor pode atualizar progresso do roteiro"
            on public.study_roadmap_completion
            for update
            to authenticated
            using ((select public.is_teacher_admin()))
            with check ((select public.is_teacher_admin()));

          drop policy if exists "Professor pode excluir progresso do roteiro"
            on public.study_roadmap_completion;
          create policy "Professor pode excluir progresso do roteiro"
            on public.study_roadmap_completion
            for delete
            to authenticated
            using ((select public.is_teacher_admin()));
'''
          sql = replace_once(sql, old, new, "phase2 rollback roadmap policies")
          rollback.write_text(sql, encoding="utf-8")

          for path in (phase2, rollback):
              content = path.read_text(encoding="utf-8")
              if 'alter policy "Alunos podem inserir suas lições do roteiro"' in content:
                  raise SystemExit(f"Legacy student insert policy remains in {path}")
              if 'alter policy "Alunos podem atualizar suas lições do roteiro"' in content:
                  raise SystemExit(f"Legacy student update policy remains in {path}")
      - name: Commit aligned security scripts
        run: |
          git config user.name "Zoqvera Development Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase_seguranca_fase2_rls.sql supabase_seguranca_fase2_rls_rollback.sql
          git diff --cached --quiet && exit 0
          git commit -m "security: preserve teacher-only roadmap writes in RLS scripts"
          git push
