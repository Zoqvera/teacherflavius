name: Retired class seat safety contracts

on:
  pull_request:
    paths:
      - "supabase/migrations/20261104024633_disable_class_seat_reservations.sql"
      - "supabase/migrations/20261104024500_throttle_public_class_seat_submission_attempts.sql"
      - "tests/class_seat_deactivation_contract.test.js"
      - ".github/workflows/retired-class-seats.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/20261104024633_disable_class_seat_reservations.sql"
      - "tests/class_seat_deactivation_contract.test.js"
      - ".github/workflows/retired-class-seats.yml"

permissions:
  contents: read

jobs:
  retired-class-seat-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Assert discontinued class seat RPCs remain sealed
        run: node --test tests/class_seat_deactivation_contract.test.js
