name: Temporary mensalidades configuration cleanup

on:
  push:
    paths:
      - .github/workflows/temp-remove-mensalidades-config.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Remove billing configuration from mensalidades page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html_path = Path('mensalidades.html')
          js_path = Path('mensalidades.js')
          html = html_path.read_text(encoding='utf-8')
          js = js_path.read_text(encoding='utf-8')

          config_section_pattern = re.compile(
              r'\n      <section class="finance-panel">\n'
              r'        <div class="panel-header">\n'
              r'          <div>\n'
              r'            <h2>Configuração por aluno</h2>.*?'
              r'        <p id="billingStudentsEmpty" class="empty-state" hidden></p>\n'
              r'      </section>\n',
              re.S,
          )
          html, section_count = config_section_pattern.subn('\n', html, count=1)
          if section_count != 1:
              raise SystemExit(f'Expected one configuration section, removed {section_count}')

          settings_modal_pattern = re.compile(
              r'\n  <div id="settingsModal" class="modal-backdrop">.*?'
              r'(?=\n  <div id="paymentModal" class="modal-backdrop">)',
              re.S,
          )
          html, modal_count = settings_modal_pattern.subn('\n', html, count=1)
          if modal_count != 1:
              raise SystemExit(f'Expected one settings modal, removed {modal_count}')

          html, wrapper_count = re.subn(
              r'\n  <script src="/mensalidades_due_day_readonly\.js\?v=[^"]+"></script>',
              '',
              html,
              count=1,
          )
          if wrapper_count != 1:
              raise SystemExit(f'Expected one settings wrapper script, removed {wrapper_count}')

          html, script_count = re.subn(
              r'<script src="mensalidades\.js\?v=[^"]+"></script>',
              '<script src="mensalidades.js?v=20260909-1"></script>',
              html,
              count=1,
          )
          if script_count != 1:
              raise SystemExit(f'Expected one mensalidades.js script tag, updated {script_count}')

          js = js.replace('let billingStudents = [];\n', '')
          js = js.replace('let selectedStudentId = null;\n', '')

          js, load_count = re.subn(
              r'\nasync function loadBillingStudents\(\) \{.*?\n\}\n',
              '\n',
              js,
              count=1,
              flags=re.S,
          )
          if load_count != 1:
              raise SystemExit(f'Expected loadBillingStudents once, removed {load_count}')

          js = js.replace(
              '      : "Nenhuma mensalidade foi gerada para este mês. Configure os alunos abaixo para iniciar.";',
              '      : "Nenhuma mensalidade foi gerada para este mês. Configure a cobrança no Perfil dos Alunos.";',
          )

          js, render_count = re.subn(
              r'\nfunction renderBillingStudents\(\) \{.*?(?=\nfunction openModal\(id\))',
              '\n',
              js,
              count=1,
              flags=re.S,
          )
          if render_count != 1:
              raise SystemExit(f'Expected renderBillingStudents block once, removed {render_count}')

          js, settings_count = re.subn(
              r'\nfunction openSettingsModal\(studentId\) \{.*?(?=\nfunction openPaymentModal\(tuitionId\))',
              '\n',
              js,
              count=1,
              flags=re.S,
          )
          if settings_count != 1:
              raise SystemExit(f'Expected settings functions block once, removed {settings_count}')

          js = js.replace(
              '  const student = billingStudents.find(function (item) { return String(item.student_id) === String(studentId); });',
              '  const student = monthlyTuition.find(function (item) { return String(item.student_id) === String(studentId); });',
          )
          js = js.replace(
              '  document.getElementById("historyStudentName").textContent = student ? (student.name || student.email || "Aluno") : "Aluno";',
              '  document.getElementById("historyStudentName").textContent = student ? (student.student_name || student.student_email || "Aluno") : "Aluno";',
          )

          js, handler_count = re.subn(
              r'\nfunction handleBillingTableClick\(event\) \{.*?\n\}\n',
              '\n',
              js,
              count=1,
              flags=re.S,
          )
          if handler_count != 1:
              raise SystemExit(f'Expected handleBillingTableClick once, removed {handler_count}')

          js = js.replace('  document.getElementById("billingStudentsBody").addEventListener("click", handleBillingTableClick);\n', '')
          js = js.replace('  document.getElementById("settingsForm").addEventListener("submit", saveBillingSettings);\n', '')
          js = js.replace('    await loadBillingStudents();\n', '')

          prohibited_html = (
              'Configuração por aluno',
              'billingStudentsBody',
              'settingsModal',
              'settingsForm',
              'mensalidades_due_day_readonly.js',
          )
          prohibited_js = (
              'billingStudents',
              'selectedStudentId',
              'loadBillingStudents',
              'renderBillingStudents',
              'openSettingsModal',
              'saveBillingSettings',
              'handleBillingTableClick',
              'get_teacher_billing_students',
              'save_student_billing_settings',
              'settingsForm',
          )

          leftovers = [token for token in prohibited_html if token in html]
          if leftovers:
              raise SystemExit(f'HTML still contains removed configuration tokens: {leftovers}')
          leftovers = [token for token in prohibited_js if token in js]
          if leftovers:
              raise SystemExit(f'JS still contains removed configuration tokens: {leftovers}')

          html_path.write_text(html, encoding='utf-8')
          js_path.write_text(js, encoding='utf-8')
          PY

          python scripts/materialize_clean_route_aliases.py
          rm mensalidades_due_day_readonly.js
          rm .github/workflows/temp-remove-mensalidades-config.yml

          git diff --check
          grep -R "Configuração por aluno" mensalidades.html mensalidades/index.html && exit 1 || true
          grep -R "mensalidades_due_day_readonly" mensalidades.html mensalidades/index.html && exit 1 || true
          grep -E "billingStudents|settingsForm|saveBillingSettings|get_teacher_billing_students|save_student_billing_settings" mensalidades.js && exit 1 || true

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: move billing configuration out of mensalidades"
          git push
