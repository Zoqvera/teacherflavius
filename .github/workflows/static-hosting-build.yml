name: Static hosting build

on:
  pull_request:
    paths:
      - "**/*.html"
      - "**/*.css"
      - "**/*.js"
      - "**/*.json"
      - "**/*.xml"
      - "**/*.txt"
      - "scripts/build_static_site.py"
      - "scripts/inject_auth_module_loader.py"
      - "scripts/inject_site_asset_loader.py"
      - "scripts/inject_site_runtime_config.py"
      - "scripts/inject_site_privacy_analytics.py"
      - "scripts/inject_google_tag_manager.py"
      - "netlify/_headers"
      - "netlify.toml"
      - ".github/workflows/static-hosting-build.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.html"
      - "**/*.css"
      - "**/*.js"
      - "**/*.json"
      - "**/*.xml"
      - "**/*.txt"
      - "scripts/build_static_site.py"
      - "scripts/inject_auth_module_loader.py"
      - "scripts/inject_site_asset_loader.py"
      - "scripts/inject_site_runtime_config.py"
      - "scripts/inject_site_privacy_analytics.py"
      - "scripts/inject_google_tag_manager.py"
      - "netlify/_headers"
      - "netlify.toml"
      - ".github/workflows/static-hosting-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static site
        run: python3 scripts/build_static_site.py

      - name: Ensure site asset loader precedes footer
        run: |
          python3 scripts/inject_site_asset_loader.py
          python3 - <<'PY'
          from pathlib import Path
          import re

          footer_re = re.compile(r'<script\b[^>]*\bsrc=["\']/?site_footer\.js(?:\?[^"\']*)?["\'][^>]*>\s*</script>', re.I)
          loader_re = re.compile(r'<script\b[^>]*\bsrc=["\']/?site_asset_loader\.js(?:\?[^"\']*)?["\'][^>]*>\s*</script>', re.I)
          for path in Path('_site').rglob('*.html'):
              html = path.read_text(encoding='utf-8')
              footer = footer_re.search(html)
              if not footer:
                  continue
              loader = loader_re.search(html)
              if not loader or loader.start() > footer.start():
                  raise SystemExit(f'Invalid site asset loader bootstrap order in {path}')
          PY

      - name: Ensure runtime configuration precedes footer
        run: |
          python3 scripts/inject_site_runtime_config.py
          python3 - <<'PY'
          from pathlib import Path
          import re

          footer_re = re.compile(r'<script\b[^>]*\bsrc=["\']/?site_footer\.js(?:\?[^"\']*)?["\'][^>]*>\s*</script>', re.I)
          config_re = re.compile(r'<script\b[^>]*\bsrc=["\']/?site_runtime_config\.js(?:\?[^"\']*)?["\'][^>]*>\s*</script>', re.I)
          for path in Path('_site').rglob('*.html'):
              html = path.read_text(encoding='utf-8')
              footer = footer_re.search(html)
              if not footer:
                  continue
              config = config_re.search(html)
              if not config or config.start() > footer.start():
                  raise SystemExit(f'Invalid site runtime configuration bootstrap order in {path}')
          PY

      - name: Ensure privacy analytics precedes footer
        run: |
          python3 scripts/inject_site_privacy_analytics.py
          python3 - <<'PY'
          from pathlib import Path
          import re

          footer_re = re.compile(r'<script\b[^>]*\bsrc=["\']/?site_footer\.js(?:\?[^"\']*)?["\'][^>]*>\s*</script>', re.I)
          privacy_re = re.compile(r'<script\b[^>]*\bsrc=["\']/?site_privacy_analytics\.js(?:\?[^"\']*)?["\'][^>]*>\s*</script>', re.I)
          for path in Path('_site').rglob('*.html'):
              html = path.read_text(encoding='utf-8')
              footer = footer_re.search(html)
              if not footer:
                  continue
              privacy = privacy_re.search(html)
              if not privacy or privacy.start() > footer.start():
                  raise SystemExit(f'Invalid privacy analytics bootstrap order in {path}')
          PY

      - name: Ensure module loader precedes auth
        run: |
          python3 scripts/inject_auth_module_loader.py
          python3 - <<'PY'
          from pathlib import Path
          import re

          auth_re = re.compile(r'<script\b[^>]*\bsrc=["\']/?auth\.js(?:\?[^"\']*)?["\'][^>]*>\s*</script>', re.I)
          loader_re = re.compile(r'<script\b[^>]*\bsrc=["\']/?module_loader\.js(?:\?[^"\']*)?["\'][^>]*>\s*</script>', re.I)
          for path in Path('_site').rglob('*.html'):
              html = path.read_text(encoding='utf-8')
              auth = auth_re.search(html)
              if not auth:
                  continue
              loader = loader_re.search(html)
              if not loader or loader.start() > auth.start():
                  raise SystemExit(f'Invalid auth bootstrap order in {path}')
          PY

      - name: Inject and validate Google Tag Manager
        run: |
          python3 scripts/inject_google_tag_manager.py
          grep -q 'GTM-K2NWR2NK' _site/index.html
          grep -q 'googletagmanager.com/ns.html?id=GTM-K2NWR2NK' _site/index.html

      - name: Validate GitHub Pages source compatibility
        run: |
          tmp_dir="$(mktemp -d)"
          cp -R . "$tmp_dir/site"
          rm -rf "$tmp_dir/site/_site" "$tmp_dir/site/.git"
          python3 "$tmp_dir/site/scripts/inject_auth_module_loader.py" --site-root "$tmp_dir/site"
          python3 "$tmp_dir/site/scripts/inject_site_asset_loader.py" --site-root "$tmp_dir/site"
          python3 "$tmp_dir/site/scripts/inject_site_runtime_config.py" --site-root "$tmp_dir/site"
          python3 "$tmp_dir/site/scripts/inject_site_privacy_analytics.py" --site-root "$tmp_dir/site"
          python3 "$tmp_dir/site/scripts/inject_google_tag_manager.py" --site-root "$tmp_dir/site"
          grep -q '/module_loader.js?v=20260902-2' "$tmp_dir/site/login.html"
          grep -q '/site_asset_loader.js?v=20260902-1' "$tmp_dir/site/index.html"
          grep -q '/site_runtime_config.js?v=20260902-1' "$tmp_dir/site/index.html"
          grep -q '/site_privacy_analytics.js?v=20260902-1' "$tmp_dir/site/index.html"
          grep -q 'GTM-K2NWR2NK' "$tmp_dir/site/index.html"

      - name: Validate publish output
        run: |
          test -f _site/index.html
          test -f _site/404.html
          test -f _site/robots.txt
          test -f _site/sitemap.xml
          test -f _site/error_monitor.js
          test -f _site/responsive_compat.css
          test -f _site/site_asset_loader.js
          test -f _site/site_runtime_config.js
          test -f _site/site_privacy_analytics.js
          test -f _site/_headers
          if find _site -type f \( -name '*.md' -o -name '*.sql' -o -name '*.py' -o -name '*.yml' -o -name '*.yaml' -o -name '*.toml' \) | grep -q .; then
            echo 'Operational file leaked into _site'
            exit 1
          fi
