name: Temporary remove YouTube click copy

on:
  push:
    paths:
      - '.github/workflows/temp-remove-youtube-click-copy.yml'

permissions:
  contents: write

jobs:
  remove-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Remove YouTube click copy from home
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '            <small>O YouTube só será carregado após o clique</small>\n'
          if text.count(old) != 1:
              raise SystemExit('Expected YouTube click copy was not found exactly once.')
          path.write_text(text.replace(old, ''), encoding='utf-8')
          PY

      - name: Commit change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: remove YouTube click note from home'
          git push
