name: Temporary restore home video preview

on:
  push:
    paths:
      - '.github/workflows/temp-restore-home-video-preview.yml'

permissions:
  contents: write

jobs:
  restore-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download video cover
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          if ! curl -fsSL --retry 3 --retry-delay 1 \
            'https://i.ytimg.com/vi/mZ2GyKKkteI/maxresdefault.jpg' \
            -o assets/home-free-class-thumbnail.jpg; then
            curl -fsSL --retry 3 --retry-delay 1 \
              'https://i.ytimg.com/vi/mZ2GyKKkteI/hqdefault.jpg' \
              -o assets/home-free-class-thumbnail.jpg
          fi
          test -s assets/home-free-class-thumbnail.jpg

      - name: Restore visible video cover
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_trigger = ".video-trigger{position:absolute;inset:0;width:100%;height:100%;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;background:radial-gradient(circle at 50% 42%,rgba(78,154,236,.24),transparent 34%),linear-gradient(145deg,#061326,#063e7d);font:inherit;font-weight:900}"
          new_trigger = ".video-trigger{position:absolute;inset:0;width:100%;height:100%;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;background:linear-gradient(rgba(1,9,24,.18),rgba(1,9,24,.52)),url('/assets/home-free-class-thumbnail.jpg?v=20260908-1') center/cover no-repeat;font:inherit;font-weight:900;text-shadow:0 2px 10px rgba(0,0,0,.72)}"

          old_hover = ".video-trigger:hover{background:radial-gradient(circle at 50% 42%,rgba(78,154,236,.34),transparent 36%),linear-gradient(145deg,#061326,#07529f)}"
          new_hover = ".video-trigger:hover{background:linear-gradient(rgba(1,9,24,.08),rgba(1,9,24,.4)),url('/assets/home-free-class-thumbnail.jpg?v=20260908-1') center/cover no-repeat}"

          if text.count(old_trigger) != 1 or text.count(old_hover) != 1:
              raise SystemExit('Expected home video styles were not found exactly once.')

          text = text.replace(old_trigger, new_trigger).replace(old_hover, new_hover)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit restored preview
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/home-free-class-thumbnail.jpg
          git commit -m 'fix: restore home video cover preview'
          git push
