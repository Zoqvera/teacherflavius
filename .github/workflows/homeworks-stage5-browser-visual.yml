name: Homeworks Stage 5 browser visual acceptance

on:
  pull_request:
    paths:
      - "homework_student_interface.js"
      - "homework_student_interface.css"
      - "homework_pedagogical_preview.js"
      - "tests/fixtures/homeworks-stage5-visual.html"
      - "tests/fixtures/homeworks-stage5-visual.js"
      - "scripts/homeworks_stage5_browser_visual_check.py"
      - ".github/workflows/homeworks-stage5-browser-visual.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  viewport-acceptance:
    name: Synthetic Homeworks UI — 320px / 390px / 1280px
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify browser executable exists
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome-stable || command -v google-chrome || command -v chromium

      - name: Verify fixtures cannot be deployed as public site files
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from static_site_files import is_public

          for target in (
              Path("tests/fixtures/homeworks-stage5-visual.html"),
              Path("tests/fixtures/homeworks-stage5-visual.js"),
              Path("scripts/homeworks_stage5_browser_visual_check.py"),
          ):
              assert not is_public(target), f"Accidentally public QA artifact: {target}"
          print("PASS: every synthetic visual fixture is excluded from publication.")
          PY

      - name: Run real browser viewport and accessibility smoke
        run: python3 scripts/homeworks_stage5_browser_visual_check.py

      - name: Save browser screenshots for teacher-only inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homeworks-stage5-synthetic-ui-screenshots
          path: _homeworks_visual_artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7
