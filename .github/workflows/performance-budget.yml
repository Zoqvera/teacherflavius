name: Performance budget

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-budgets:
    name: Static performance budgets
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build static site
        run: |
          python3 scripts/build_static_site.py
          python3 scripts/postprocess_production.py
      - name: Validate performance budgets
        run: python3 scripts/check_performance_budgets.py --root _site --json performance-budget-report.json
      - name: Run performance checker tests
        run: |
          python3 -m unittest tests.test_performance_budgets tests.test_lighthouse_guardrails
      - name: Upload budget report
        uses: actions/upload-artifact@v4
        with:
          name: performance-budget-report
          path: performance-budget-report.json

  lighthouse-lab:
    name: Lighthouse lab guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Build static site
        run: |
          python3 scripts/build_static_site.py
          python3 scripts/postprocess_production.py
      - name: Start local static server
        run: |
          python3 -m http.server 4173 --directory _site >/tmp/teacherflavius-http.log 2>&1 &
          echo $! > /tmp/teacherflavius-http.pid
          for attempt in $(seq 1 20); do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Run three Lighthouse mobile samples
        shell: bash
        run: |
          set -euo pipefail
          for sample in 1 2 3; do
            npx --yes lighthouse@13.0.1 http://127.0.0.1:4173/ \
              --only-categories=performance \
              --output=json \
              --output-path="lighthouse-home-mobile-${sample}.json" \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --quiet
          done
      - name: Validate median Lighthouse guardrails
        run: |
          python3 scripts/check_lighthouse_guardrails.py \
            lighthouse-home-mobile-1.json \
            lighthouse-home-mobile-2.json \
            lighthouse-home-mobile-3.json
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-home-mobile
          path: lighthouse-home-mobile-*.json
