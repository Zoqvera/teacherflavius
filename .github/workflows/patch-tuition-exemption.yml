name: Materialize tuition exemption clean route

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/patch-tuition-exemption.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize mensalidades clean route
        run: python3 scripts/materialize_clean_route_aliases.py --site-root .

      - name: Validate exemption UI on clean route
        shell: bash
        run: |
          grep -q 'summaryExempt' mensalidades/index.html
          grep -q 'value="exempt"' mensalidades/index.html
          grep -q 'mensalidades.js?v=20260902-exempt-1' mensalidades/index.html

      - name: Commit generated route
        shell: bash
        run: |
          if git diff --quiet -- mensalidades/index.html; then
            echo "Clean route is already materialized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mensalidades/index.html
          git commit -m "chore: materialize tuition exemption route"
          git push origin HEAD:main
