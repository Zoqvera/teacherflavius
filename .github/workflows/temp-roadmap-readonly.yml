name: Temporary make study roadmap read-only

on:
  push:
    paths:
      - ".github/workflows/temp-roadmap-readonly.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Finalize roadmap read-only UI
        shell: python
        run: |
          from pathlib import Path

          path = Path("roteiro_de_estudos.html")
          html = path.read_text(encoding="utf-8")

          broken_tail = '      grid.innerHTML = cards.join("");\n      });\n    }\n\n    async function loadCompletedLessons() {'
          fixed_tail = '      grid.innerHTML = cards.join("");\n    }\n\n    async function loadCompletedLessons() {'
          if broken_tail in html:
              html = html.replace(broken_tail, fixed_tail, 1)

          required = [
              "O registro de conclusão das lições é controlado pelo professor e não pode ser alterado pelo aluno.",
              "Conclusão registrada",
              "Aguardando registro do professor",
              '.from("study_roadmap_completion")',
              '.select("lesson_id, completed")',
          ]
          missing = [token for token in required if token not in html]
          if missing:
              raise SystemExit(f"Required read-only elements missing: {missing}")

          forbidden = [
              "completion-button",
              "saveLessonCompletion",
              "MARCAR COMO FEITA",
              "MARCAR COMO NÃO FEITA",
              ".upsert({",
          ]
          found = [token for token in forbidden if token in html]
          if found:
              raise SystemExit(f"Student completion controls still present: {found}")

          path.write_text(html, encoding="utf-8")

          script_start = html.index("    let currentUser = null;")
          script_end = html.index("    guardPage();", script_start) + len("    guardPage();")
          Path("/tmp/roadmap-inline.js").write_text(html[script_start:script_end], encoding="utf-8")
      - name: Validate roadmap JavaScript syntax
        run: node --check /tmp/roadmap-inline.js
      - name: Commit roadmap UI update
        run: |
          git config user.name "Zoqvera Development Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add roteiro_de_estudos.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: finalize read-only study roadmap"
          git push
