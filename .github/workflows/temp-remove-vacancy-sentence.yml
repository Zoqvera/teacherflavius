name: Temporary remove vacancy sentence

on:
  push:
    paths:
      - ".github/workflows/temp-remove-vacancy-sentence.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Remove vacancy sentence
        run: python scripts/temp_remove_vacancy_sentence.py
      - name: Commit public page updates
        run: |
          git config user.name "Zoqvera Development Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' '**/*.html'
          git diff --cached --quiet && exit 0
          git commit -m "fix: remove vacancy sentence from public pages"
          git push
