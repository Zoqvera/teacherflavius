name: Encrypted Supabase logical backup

on:
  schedule:
    # 03:17 UTC = 00:17 in America/Sao_Paulo.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Create encrypted logical backup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      backup_id: ${{ steps.backup.outputs.backup_id }}
      tier: ${{ steps.backup.outputs.tier }}
      retention: ${{ steps.backup.outputs.retention }}
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Create, encrypt and self-check backup
        id: backup
        shell: bash
        run: bash scripts/create_encrypted_supabase_backup.sh

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v7
        with:
          name: supabase-${{ steps.backup.outputs.tier }}-${{ steps.backup.outputs.backup_id }}
          path: |
            ${{ steps.backup.outputs.encrypted }}
            ${{ steps.backup.outputs.checksum }}
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ steps.backup.outputs.retention }}

      - name: Remove encrypted runner copies
        if: always()
        shell: bash
        run: |
          rm -f -- \
            "${{ steps.backup.outputs.encrypted }}" \
            "${{ steps.backup.outputs.checksum }}"
