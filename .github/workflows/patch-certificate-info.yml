name: Patch certificate information

on:
  push:
    paths:
      - ".github/workflows/patch-certificate-info.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Insert certificate information in public course funnel
        shell: python
        run: |
          from pathlib import Path

          path = Path("curso-de-ingles-online/index.html")
          html = path.read_text(encoding="utf-8")

          card_anchor = '<article class="card"><h3>Aula experimental</h3><p>Você pode experimentar o formato gratuitamente antes de decidir pela matrícula.</p></article>'
          certificate_card = '<article class="card"><h3>Certificado por módulo</h3><p>Ao final de cada módulo, o aluno pode receber um certificado de conclusão após realizar uma avaliação final correspondente ao nível de proficiência alcançado.</p></article>'
          if certificate_card not in html:
              if card_anchor not in html:
                  raise SystemExit("Expected included-section anchor was not found")
              html = html.replace(card_anchor, card_anchor + "\n          " + certificate_card, 1)

          investment_row = '<tr><td>Investimento mensal</td><td class="yes">R$ 99,90</td></tr>'
          certificate_row = '<tr><td>Certificado ao final de cada módulo</td><td class="yes">Após avaliação final</td></tr>'
          if certificate_row not in html:
              if investment_row not in html:
                  raise SystemExit("Expected comparison-table anchor was not found")
              html = html.replace(investment_row, certificate_row + "\n              " + investment_row, 1)

          cost_faq = '<article class="faq-item"><h3>Quanto custa o curso de inglês online?</h3><p>O investimento atual é de R$ 99,90 por mês, sujeito à disponibilidade de vagas nas turmas.</p></article>'
          certificate_faq = '<article class="faq-item"><h3>O curso oferece certificado?</h3><p>Sim. Ao final de cada módulo, o aluno pode receber um certificado de conclusão. A emissão ocorre após a realização de uma avaliação final com conteúdos e competências correspondentes ao nível de proficiência alcançado.</p></article>'
          if certificate_faq not in html:
              if cost_faq not in html:
                  raise SystemExit("Expected FAQ anchor was not found")
              html = html.replace(cost_faq, certificate_faq + "\n          " + cost_faq, 1)

          path.write_text(html, encoding="utf-8")

      - name: Commit public certificate information
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- curso-de-ingles-online/index.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "Zoqvera Development Automation"
          git config user.email "actions@users.noreply.github.com"
          git add curso-de-ingles-online/index.html
          git commit -m "feat: explain certificate requirements in course funnel"
          git push origin HEAD:main
