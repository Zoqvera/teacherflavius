<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://teacherflavius.com/aula-experimental/">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#071c39">
  <title>AULAS EXPERIMENTAIS | Teacher Flavius</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/aula-experimental/styles.css?v=20261022-1">
  <script defer src="/trial_meet_access.js?v=20261022-1"></script>
</head>
<body>
  <main class="page-shell">
    <section class="entry-card" aria-labelledby="trial-heading">
      <div class="brand">TEACHER FLAVIUS</div>
      <h1 id="trial-heading">AULAS EXPERIMENTAIS</h1>
      <p class="intro">Informe seus dados para acessar a aula experimental.</p>

      <form id="trialMeetForm" novalidate>
        <div class="field">
          <label for="visitorName">Nome:</label>
          <input id="visitorName" name="visitor_name" type="text" autocomplete="name"
                 maxlength="120" placeholder="Seu nome" required>
        </div>

        <div class="field">
          <label for="visitorWhatsapp">Whatsapp:</label>
          <input id="visitorWhatsapp" name="whatsapp" type="tel" autocomplete="tel"
                 inputmode="tel" maxlength="24" placeholder="(34) 99999-9999" required>
        </div>

        <fieldset class="lesson-options">
          <legend>Qual aula experimental você vai participar?</legend>
          <label class="lesson-option">
            <input type="radio" name="lesson_slot" value="monday_18" required>
            <span>Segunda-feira 18h</span>
          </label>
          <label class="lesson-option">
            <input type="radio" name="lesson_slot" value="tuesday_10">
            <span>Terça-feira 10h da manhã</span>
          </label>
          <label class="lesson-option">
            <input type="radio" name="lesson_slot" value="tuesday_15">
            <span>Terça-feira 15h</span>
          </label>
          <label class="lesson-option">
            <input type="radio" name="lesson_slot" value="thursday_20">
            <span>Quinta-feira 20h</span>
          </label>
        </fieldset>

        <input class="honeypot" type="text" name="website" tabindex="-1"
               autocomplete="off" aria-hidden="true">
        <p id="trialMeetError" class="form-error" role="alert" hidden></p>
        <button id="trialMeetSubmit" class="submit-button" type="submit">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="13" height="14" rx="2"></rect>
            <path d="m16 10 5-3v10l-5-3"></path>
          </svg>
          <span>PARTICIPAR DA AULA</span>
        </button>
      </form>
      <p class="privacy-note">Seus dados serão utilizados para identificar o acesso à aula experimental.
        <a href="/privacidade/">Política de Privacidade</a>.
      </p>
    </section>
  </main>
</body>
</html>
