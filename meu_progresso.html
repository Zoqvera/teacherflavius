  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      color: #f1f5f9;
      font-family: Georgia, serif;
      padding: 32px 16px 56px;
    }
    .container { width: 100%; max-width: 900px; margin: 0 auto; }
    .top-links { display: flex; gap: 10px; justify-content: center; margin-bottom: 24px; flex-wrap: wrap; }
    .top-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 9px 16px;
      border: 1.5px solid rgba(129,140,248,0.35);
      border-radius: 10px;
      background: rgba(255,255,255,0.05);
      color: #a5b4fc;
      font-size: 13px;
      text-decoration: none;
    }
    .header { text-align: center; margin-bottom: 28px; }
    .badge {
      display: inline-block;
      margin-bottom: 12px;
      padding: 4px 14px;
      border-radius: 20px;
      background: linear-gradient(90deg, #818cf8, #a78bfa);
      color: #fff;
      font-family: monospace;
      font-size: 11px;
      letter-spacing: 3px;
    }
    h1 { font-size: clamp(30px, 6vw, 42px); margin-bottom: 8px; }
    .subtitle { color: #cbd5e1; font-size: 15px; line-height: 1.6; }
    .status { margin-top: 8px; color: #94a3b8; font-size: 13px; }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .summary-card {
      padding: 18px;
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 16px;
      background: rgba(255,255,255,0.045);
      backdrop-filter: blur(12px);
      text-align: center;
    }
    .summary-value { font-size: 30px; font-weight: bold; }
    .summary-label { margin-top: 5px; color: #94a3b8; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
    .progress-panel {
      padding: 18px;
      margin-bottom: 18px;
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 16px;
      background: rgba(255,255,255,0.045);
    }
    .progress-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 10px; }
    .progress-title { font-weight: bold; }
    .progress-percent { color: #a5b4fc; font-weight: bold; }
    .progress-track { height: 12px; border-radius: 999px; overflow: hidden; background: rgba(255,255,255,0.08); }
    .progress-fill { height: 100%; width: 0%; border-radius: inherit; background: linear-gradient(90deg, #818cf8, #a78bfa); transition: width .35s ease; }
    .filters { display: flex; gap: 10px; flex-wrap: wrap; margin: 22px 0 16px; }
    .filter-button {
      border: 1px solid rgba(129,140,248,0.35);
      border-radius: 999px;
      background: rgba(255,255,255,0.04);
      color: #cbd5e1;
      padding: 9px 14px;
      font-family: Georgia, serif;
      cursor: pointer;
    }
    .filter-button.active { background: #818cf8; color: #fff; border-color: #818cf8; }
    .activity-list { display: grid; gap: 12px; }
    .activity-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 16px;
      padding: 17px 18px;
      border: 1.5px solid rgba(248,113,113,0.68);
      border-radius: 16px;
      background: rgba(127,29,29,0.32);
    }
    .activity-card.done {
      border-color: rgba(74,222,128,0.68);
      background: rgba(20,83,45,0.38);
    }
    .activity-title { font-size: 16px; font-weight: bold; margin-bottom: 6px; }
    .activity-meta { color: #cbd5e1; font-size: 13px; line-height: 1.45; }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 9px;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
    }
    .status-badge.done { background: rgba(74,222,128,0.16); color: #86efac; }
    .status-badge.pending { background: rgba(248,113,113,0.16); color: #fca5a5; }
    .activity-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 126px;
      padding: 10px 13px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.28);
      color: #f8fafc;
      text-decoration: none;
      font-size: 13px;
      text-align: center;
    }
    .empty, .blocked-panel {
      padding: 22px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      background: rgba(255,255,255,0.04);
      color: #cbd5e1;
      text-align: center;
      line-height: 1.6;
    }
    @media (max-width: 720px) {
      .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .activity-card { grid-template-columns: 1fr; }
      .activity-action { width: 100%; }
    }

  <main class="container">
    <nav class="top-links">
      <a class="top-link" href="/">HOME</a>
      <a class="top-link" href="area_do_estudante.html">ÁREA DO ESTUDANTE</a>
      <a class="top-link" href="exercicios.diarios.html">PORTAL DE EXERCÍCIOS</a>
    </nav>

    <header class="header">
      <span class="badge">TEACHER FLÁVIO</span>
      <h1>Meu Progresso</h1>
      <p class="subtitle">Acompanhe as atividades que você já concluiu e veja o que ainda falta fazer.</p>
      <div id="pageStatus" class="status">Carregando seu progresso...</div>
    </header>

    <section id="dashboard" hidden>
      <div class="summary-grid">
        <div class="summary-card"><div id="totalCount" class="summary-value">0</div><div class="summary-label">Total</div></div>
        <div class="summary-card"><div id="doneCount" class="summary-value">0</div><div class="summary-label">Concluídas</div></div>
        <div class="summary-card"><div id="pendingCount" class="summary-value">0</div><div class="summary-label">Pendentes</div></div>
        <div class="summary-card"><div id="percentCount" class="summary-value">0%</div><div class="summary-label">Progresso</div></div>
      </div>

      <div class="progress-panel">
        <div class="progress-head"><span class="progress-title">Progresso geral</span><span id="progressPercent" class="progress-percent">0%</span></div>
        <div class="progress-track" aria-label="Progresso geral"><div id="progressFill" class="progress-fill"></div></div>
      </div>

      <div class="filters" aria-label="Filtrar atividades">
        <button class="filter-button active" type="button" data-filter="all">Todas</button>
        <button class="filter-button" type="button" data-filter="pending">Pendentes</button>
        <button class="filter-button" type="button" data-filter="done">Concluídas</button>
      </div>

      <div id="activityList" class="activity-list"></div>
    </section>

    <div id="messagePanel" class="blocked-panel" hidden></div>
  </main>

  <script>
    let currentUser = null;
    let activities = [];
    let currentFilter = "all";

    function escapeHtml(value) {
      return String(value || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function isEnrolledProfile(profile) {
      return !!profile && (profile.enrolled === true || profile.enrolled === "true" || !!profile.enrollment_code);
    }

    function extractActivityNumber(title) {
      const match = String(title || "").match(/ATIVIDADE\s+(\d+)/i);
      return match ? Number(match[1]) : Number.MAX_SAFE_INTEGER;
    }

    function formatCompletedAt(value) {
      if (!value) return "Data não disponível";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "Data não disponível";
      return new Intl.DateTimeFormat("pt-BR", {
        timeZone: "America/Sao_Paulo",
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      }).format(date);
    }

    function showMessage(message) {
      document.getElementById("dashboard").hidden = true;
      const panel = document.getElementById("messagePanel");
      panel.hidden = false;
      panel.textContent = message;
    }

    async function loadTeacherExercises() {
      const client = Auth.getClient();
      const response = await client.rpc("get_public_teacher_exercises");
      if (response.error) throw response.error;
      return (response.data || []).map(function (item) {
        return {
          id: item.exercise_id,
          title: item.exercise_title,
          url: item.exercise_url
        };
      });
    }

    async function loadStudentCompletions() {
      const client = Auth.getClient();
      const response = await client
        .from("daily_exercise_completion")
        .select("exercise_id, completed, completed_at")
        .eq("user_id", currentUser.id);
      if (response.error) throw response.error;
      return response.data || [];
    }

    function buildActivities(exercises, completions) {
      const completionMap = new Map();
      completions.forEach(function (row) {
        completionMap.set(row.exercise_id, row);
      });

      const seen = new Set();
      activities = exercises
        .filter(function (exercise) {
          if (!exercise.id || seen.has(exercise.id)) return false;
          seen.add(exercise.id);
          return true;
        })
        .map(function (exercise) {
          const record = completionMap.get(exercise.id);
          return {
            id: exercise.id,
            title: exercise.title,
            url: exercise.url,
            done: !!record && record.completed === true,
            completedAt: record && record.completed === true ? record.completed_at : null
          };
        })
        .sort(function (a, b) {
          const numberDiff = extractActivityNumber(a.title) - extractActivityNumber(b.title);
          return numberDiff !== 0 ? numberDiff : String(a.title).localeCompare(String(b.title), "pt-BR");
        });
    }

    function updateSummary() {
      const total = activities.length;
      const done = activities.filter(function (activity) { return activity.done; }).length;
      const pending = total - done;
      const percent = total ? Math.round((done / total) * 100) : 0;

      document.getElementById("totalCount").textContent = total;
      document.getElementById("doneCount").textContent = done;
      document.getElementById("pendingCount").textContent = pending;
      document.getElementById("percentCount").textContent = percent + "%";
      document.getElementById("progressPercent").textContent = percent + "%";
      document.getElementById("progressFill").style.width = percent + "%";
    }

    function renderActivities() {
      const list = document.getElementById("activityList");
      const filtered = activities.filter(function (activity) {
        if (currentFilter === "done") return activity.done;
        if (currentFilter === "pending") return !activity.done;
        return true;
      });

      if (!filtered.length) {
        list.innerHTML = '<div class="empty">Nenhuma atividade nesta categoria.</div>';
        return;
      }

      list.innerHTML = filtered.map(function (activity) {
        const statusText = activity.done ? "✓ Concluída" : "• Pendente";
        const metaText = activity.done ? "Concluída em " + formatCompletedAt(activity.completedAt) : "Esta atividade ainda não foi marcada como concluída.";
        const actionText = activity.done ? "Abrir atividade" : "Fazer atividade";
        return '<article class="activity-card ' + (activity.done ? 'done' : '') + '">' +
          '<div>' +
            '<div class="activity-title">' + escapeHtml(activity.title) + '</div>' +
            '<div class="activity-meta">' + escapeHtml(metaText) + '</div>' +
            '<span class="status-badge ' + (activity.done ? 'done' : 'pending') + '">' + statusText + '</span>' +
          '</div>' +
          '<a class="activity-action" href="' + escapeHtml(activity.url) + '" target="_blank" rel="noopener noreferrer">' + actionText + '</a>' +
        '</article>';
      }).join("");
    }

    function bindFilters() {
      document.querySelectorAll(".filter-button").forEach(function (button) {
        button.addEventListener("click", function () {
          currentFilter = button.dataset.filter || "all";
          document.querySelectorAll(".filter-button").forEach(function (item) { item.classList.remove("active"); });
          button.classList.add("active");
          renderActivities();
        });
      });
    }

    async function initPage() {
      if (!window.Auth || !Auth.isConfigured()) {
        if (window.Auth && Auth.showConfigWarning) Auth.showConfigWarning();
        document.getElementById("pageStatus").textContent = "Supabase ainda não configurado.";
        showMessage("Não foi possível carregar o painel de progresso.");
        return;
      }

      const session = await Auth.getSession();
      if (!session || !session.user) {
        window.location.href = "login.html?next=" + encodeURIComponent("meu_progresso.html");
        return;
      }

      currentUser = session.user;

      try {
        const profile = await Auth.getProfile();
        if (!isEnrolledProfile(profile)) {
          document.getElementById("pageStatus").textContent = "Acesso restrito a alunos matriculados.";
          showMessage("Este painel está disponível apenas para alunos matriculados.");
          return;
        }

        const results = await Promise.all([loadTeacherExercises(), loadStudentCompletions()]);
        buildActivities(results[0], results[1]);
        updateSummary();
        renderActivities();
        bindFilters();

        document.getElementById("messagePanel").hidden = true;
        document.getElementById("dashboard").hidden = false;
        document.getElementById("pageStatus").textContent = "Aluno conectado: " + currentUser.email + ".";
      } catch (error) {
        console.error("Erro ao carregar painel de progresso:", error);
        document.getElementById("pageStatus").textContent = "Não foi possível carregar seus registros.";
        showMessage("Não foi possível carregar o painel de progresso agora.");
      }
    }

    initPage();
  </script>
